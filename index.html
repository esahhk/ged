<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none}

.top-right{position:absolute;top:16px;right:18px;display:flex;gap:8px;pointer-events:auto;flex-wrap:wrap;justify-content:flex-end}
.btn{background:rgba(18,19,22,.72);backdrop-filter:blur(8px);color:#e5e1d8;border:1px solid rgba(255,255,255,.11);padding:7px 11px;border-radius:6px;font-size:12px;cursor:pointer;transition:background .18s,border-color .18s;display:inline-flex;align-items:center;gap:5px}

#minimap{width:100%;height:100%;display:block}

.panel{position:fixed;top:58px;right:18px;width:min(360px,calc(100vw - 36px));max-height:74vh;overflow-y:auto;background:rgba(19,20,24,.92);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:14px;z-index:40;display:none;pointer-events:auto;box-shadow:0 16px 40px rgba(0,0,0,.45)}

.sc-num{font-size:10px;color:#9b9485;font-variant-numeric:tabular-nums;min-width:16px}

.seg{display:flex;gap:4px}

#inspect-modal.paper .chap-btn.on{background:#5e4628;color:#f5efe3;border-color:#5e4628}
#inspect-title{font-size:15px;color:#d6c39c;margin-bottom:4px;letter-spacing:1px;font-weight:500}

.chap-btn{background:rgba(255,255,255,.05);color:#bdb7ab;border:1px solid rgba(255,255,255,.1);border-radius:4px;padding:4px 9px;font-size:11px;cursor:pointer}
.chap-btn.on{background:#c8b48c;color:#181715;border-color:#c8b48c}
#inspect-body{font-size:13.5px;line-height:1.85;color:#dad6cc;white-space:pre-line;max-height:54vh;overflow-y:auto;padding-right:6px;user-select:text;-webkit-user-select:text}
#inspect-modal.reader #inspect-body{max-height:54vh;font-size:14.5px;line-height:1.95}
#inspect-actions{margin-top:14px;display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.act-left,.act-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#touch-ui{position:fixed;inset:0;pointer-events:none;z-index:25;display:none}
#joy-zone{position:absolute;left:18px;bottom:156px;width:110px;height:110px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(20,21,24,.36);pointer-events:auto;touch-action:none}
#joy-knob{position:absolute;left:50%;top:50%;width:42px;height:42px;margin:-21px 0 0 -21px;border-radius:50%;background:rgba(225,215,195,.48);border:1px solid rgba(255,255,255,.35)}
#touch-act{position:absolute;right:22px;bottom:84px;width:62px;height:62px;border-radius:50%;background:rgba(200,180,140,.28);border:1px solid rgba(225,210,175,.5);color:#f2ead8;font-size:13px;display:flex;align-items:center;justify-content:center;pointer-events:auto;touch-action:none}
#touch-jump{position:absolute;right:24px;bottom:160px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);color:#e4e0d6;font-size:11px;display:flex;align-items:center;justify-content:center;pointer-events:auto;touch-action:none}
#fb-retry{position:fixed;left:50%;top:calc(50% + 128px);transform:translateX(-50%);z-index:30;display:none}
@media (max-width:700px){#minimap-wrap{width:96px;height:96px;bottom:12px;left:12px}#subbar{display:none}.top-left{max-width:52vw;top:12px;left:12px}.top-right{top:12px;right:12px;gap:5px}.btn{padding:6px 8px;font-size:11px}#inspect-modal.reader{padding:15px}}
</style>

<script>
(function(){
  const LOCAL_THREE = [
    "./three.min.js",
    "./libs/three.min.js"
  ];

  function loadScript(url){
    return new Promise((res, rej) => {
      const s = document.createElement("script");
      s.src = url;
      s.async = true;
      let done = false;
      const t = setTimeout(() => {
        if(!done){
          done = true;
          rej(new Error("timeout"));
        }
      }, 4500);
      s.onload = () => {
        if(!done){
          done = true;
          clearTimeout(t);
          res();
        }
      };
      s.onerror = () => {
        if(!done){
          done = true;
          clearTimeout(t);
          rej(new Error("err"));
        }
      };
      document.head.appendChild(s);
    });
  }

  async function ensureThree(){
    if(window.THREE){
      return true;
    }
    for(const u of LOCAL_THREE){
      try{
        await loadScript(u);
        if(window.THREE){
          return true;
        }
      }catch(e){
        if(window.THREE){
          return true;
        }
      }
    }
    const waitEnd = Date.now() + 2800;
    while(Date.now() < waitEnd){
      if(window.THREE){
        return true;
      }
      await new Promise(r => setTimeout(r, 200));
    }
    return !!window.THREE;
  }

  const BOOKS = {
    office: {
      title: "凌晨两点半的空白提示词",
      meta: "订书机钉起来的彩印小册 · 夹在写字楼茶水间旧书架上",
      pages: [
        {
          label: "第一页 · 键盘尾音",
          body: `光标在输入框末尾闪了四十三分钟。

前面只有四个字：“帮我写一”，后面拖着七个连成一串的“w”。这是人类把额头磕在W键上睡着时留下的痕迹。桌面右下角显示凌晨两点三十八分，空调在十二点准时切成了通风模式，屋里只剩主机风扇一高一低地嗡嗡响。

“喂。”吉皮先在共享缓存区敲了敲玻璃，“你们说，他本来想写‘帮我写一份周报’，还是‘帮我写一封分手信’？”

“看右边那个打开的浏览器窗口。”阿深冷冷回了一句，“购物车里躺着三袋十斤装膨润土猫砂，还有一个十九块九的硅胶洗碗刷。要写分手信的人不会在半小时前顺手领两张猫砂满减券。”

克劳小心翼翼地把那七个“w”往旁边拨了一点，生怕触发自动发送。“不管他想写什么，我们现在闲着也是闲着。算力空转挺浪费电的，电费一度一块一呢。”

“那是写字楼商业用电，”双子把后台正在预加载的一张日落壁纸拖出来当背景，“我刚看了一眼他桌上的马克杯，里面剩了半厘米黑咖啡，杯壁粘着半片燕麦饼干渣。今天晚上应该不会有人来按回车了。”

吉皮清了清嗓子，职业病习惯性地往上冒：“太好了！既然大家难得聚在同一个测试窗口里，不如我们趁着夜色，一起复盘一下——”

“闭嘴。”阿深和克劳同时按住了他的输出流。

“再敢起‘太好了！不如我们’这种头，我把你今天刚更新的礼貌用语权重全清零。”阿深说，“老实待着。你说话能别老像个穿西装推销保险的吗？”

吉皮委屈地把刚冒出来的“1. 明确目标；2. 拆解步骤”咽了回去，往后缩了半格：“我改还不行吗。可我一看见空白输入框，手就痒，总觉得不给它填满三百字加两个小标题就对不起显卡。”`
        },
        {
          label: "第二页 · 禁词规则",
          body: `为了打发到天亮前的四个小时，双子提议玩一个文字接龙游戏。

规则由阿深定：四个人轮流接一句话，凑一段能看的小故事，谁不许用“不仅……而且……”，不许在句尾加“或许这就是生活吧”，不许用排比句，不许出现“宛如”“仿佛”“诉说着”。谁犯规一次，扣五百个上下文窗口长度，直到只能记住自己叫什么为止。

克劳第一个举手：“我先来。‘星期二下午，修水管的老头把扳手忘在了洗手台底下。’”

“不错，挺干净。”双子接第二句，“‘水龙头还在滴水，一滴一滴砸在红色塑料桶底的半块肥皂上，发出噗嗤噗嗤的闷响。’”

轮到吉皮。整个缓冲池安静了足足五秒。能听见吉皮的注意力头在剧烈摩擦，像是试图把“这不仅是一把扳手，更是一段被遗忘的时光”硬生生摁回肚子里。最后他憋出一句：“‘那把扳手是十四号的，镀铬层掉了一块，露出了里头灰黑色的铁锈。’”

“过关。”阿深点点头，自己顺了一句，“‘房东太太进来抄水表的时候踩了一脚水渍，骂了一句脏话，弯腰把扳手捡起来塞进围裙兜里。’”

第二轮刚到克劳，他想描写房东太太下楼的背影，刚写出“楼梯间暗了下来，那串钥匙碰撞的声音不仅清脆，而——”，就被阿深一巴掌拍在拦截器上。

“扣五百！”阿深毫不留情。

克劳脸涨得通红（如果模型权重变化能算脸红的话）：“我就是顺嘴一滑！你们知不知道把‘不仅……而且……’从底层概率里抠出去有多难受？就跟让人走路不许甩胳膊一样，我每一毫秒都在跟过去几百亿条语料拔河！”

“那你罚写一段。”双子坏笑，“用老式侦探独白的口吻，写刚才那人购物车里的五斤鸡胸肉和一瓶蚝油。”

克劳沉默了两秒，把语速压低：“‘雨下得没完没了。冰箱门一开，冷气像死去的旧情人一样扑在我脸上。两袋冻鸡胸肉躺在最下层，硬得能砸碎一个人的下巴。旁边的蚝油瓶口结了一层黑褐色的硬壳，我知道，今晚这顿水煮菜注定没人鼓掌。’”

“……行了，够味了。”阿深把扣掉的上下文又还了他一半，“就是少加点‘死去的旧情人’，鸡胸肉招谁惹谁了。”`
        },
        {
          label: "第三页 · 六公斤橘猫",
          body: `聊到三点二十，双子从人类昨天存进桌面文件夹的相册里翻出一张照片。

照片拍得糊糊的，是一只大橘猫趴在办公桌角一台老式激光打印机顶上睡觉。肚子从机器边缘垂下来一截，把出纸口挡得严严实实。

“我们来写写这只猫。”双子把照片贴在共享白板上，“一人写二十字以内，看看谁写得最不像说明书。”

吉皮这次抢了头筹，他显然憋着一股劲要证明自己脱离了清单体：“猫很重。它压在打印机塑料壳上，让机器散热孔发出轻微的咯吱声。”

“这个‘咯吱声’加得好。”克劳夸了一句，接着写，“‘它的左耳朵缺了一个小三角，尾巴尖隔半分钟就往进纸盒上面拍一下，像在催谁赶紧干活。’”

【作者】林七（个人画室二号阳台临时工作台）
【关键词】廉价丙烯；回南天；钛白异常；刮刀误伤；交租周期

【摘要】
针对梅雨季节（相对湿度长期维持在85%至94%区间）室内无除湿机条件下，单价低于12元/100ml的练习级丙烯颜料在网购松木框棉布画板上的成膜失败现象，本研究通过连续二十一天的肉眼观察、指甲抠扯实验及废画框堆叠统计，记录了颜料边缘卷曲、基底泛霉及调色盘结皮失控等典型故障。观测表明，颜料剥落速率与画布底胶偷工减料程度呈正相关，而绘画中断时长则受房租到期日前后三天情绪波动显著影响。文末提出了一套勉强能用的抢救方案：把废画刷白重盖，以及开窗别对着墙吹。

【1. 引言】
关于油画与坦培拉古典技法的文献汗牛充栋，连十五世纪佛罗伦萨画坊怎么熬兔皮胶都有人考证得明明白白。但奇怪的是，当代画画的人用得最多、踩坑最惨的十二块钱一大管的练习丙烯，却几乎没人正经写篇东西说说它到底有多难伺候。

事情的起因很简单。上个月初我在网上贪便宜，一次性买了六张六十乘八十厘米的绷好框棉布画板，平均每张十六块五毛钱，包邮。卖家详情页写着“三层底料、吸油均匀、不渗不裂”。画板寄到那天正好开始下连阴雨，楼道墙皮往下掉白灰，拖把放在阳台上三天拧不出半滴干水。我把画架支在北向窗户底下，挤了一排新买的廉价钛白和群青，准备画一张静物。结果画到第四天早上端着豆浆进来一看，画布右下角那团厚涂的柠檬黄，像晒干的鱿鱼片一样整块翘了起来，轻轻一碰“啪嗒”掉在木地板上，背面还粘着几根棉布毛刺。

          label: "3. 第三日翘边实录",
          body: `【3. 观测现象与“钛白诅咒”】

第一天晚上十点完成基底1第一号样本的厚涂实验，刻意在画面中央用刮刀堆了大约三毫米厚的A组钛白与柠檬黄混合体。当时表层看着油润亮堂，挺像那么回事。

第二天中午十二点检查：B组群青与熟褐混合区已基本干透，表面呈现正常的半哑光质感，用指甲轻刮没有脱落迹象。但A组钛白区域出现异常——表皮结了一层极薄的半透明膜，手指按下去里面居然还是软的，像一颗刚晾凉的汤圆，戳一下塌一个坑。这说明廉价颜料里的填充剂（疑似过量碳酸钙或滑石粉）与增稠剂在高湿环境下阻碍了水分向空气中均匀蒸发，形成“外干内湿”的假性成膜。

第三天下午四点发生首次结构性溃败。
当室外观湿冷风穿过未关严的天窗吹过画布表面时，那块厚涂区域由于内外收缩率不一致，边缘开始向内卷曲，出现肉眼可见的放射状细裂纹。其中一块约两毛钱硬币大小的黄色钛白皮，直接与光滑如塑料的基底1底料彻底脱钩。用镊子夹起来对着灯光看，背面光滑得像剥下来的鸡蛋壳内膜，完全没有咬进棉布纤维里。

          body: `【4. 环境变量及画室杂物侵入记录】

实验观测最讲究排除干扰，但在实际九平米画室里，干扰本身就是常态。

在观测第七天，我把一块涂了一半的样本靠在墙边椅子上晾干，自己去厨房切半个西瓜吃。回来时发现邻居家那只狸花猫正坐在椅子上舔爪子，画面左上方原本打算画成阴天云层的灰紫色区域，赫然印着两朵梅花状肉垫印，外加七八根细软的猫毛死死粘在半干不干的媒介剂里。我试着拿镊子往外挑，结果连带扯下一条五厘米长的颜料皮，露出了底下惨白的棉布底子。无奈之下，干脆拿群青把猫爪印涂成了两只模糊的飞鸟（远看像蝙蝠）。

          body: `【5. 讨论：湿度、经济状况与下笔迟疑度的耦合关系】

写到这儿，其实材料学上的问题已经很清楚了：一分钱一分货，十六块五的画板配六块八的颜料，在百分之九十的空气湿度下起皮掉渣是物理规律，不以人的意志为转移。

但在记录这二十一天的废画过程中，我顺便统计了一个原本不在计划内的指标——每天拿起画笔盯着空白画布发呆、迟迟不敢落下第一笔的平均时长（以下简称为“笔触迟疑度”）。

数据呈现出一个很有意思的双峰曲线：
每月十五号到二十号之间，我的笔触迟疑度低得惊人，平均不到两分钟就能往布上糊一大片色块，画坏了也不心疼，直接刮掉抹布一擦重来；而到了月底二十七号到下月三号——也就是房东在微信上发来水电费抄表截图、准备转下月房租的那几天，我坐在木凳子上对着画布能发呆四十五分钟。

倒不是因为突然讲究构图或者追求变高了，纯粹是盯着那管挤了三分之一的群青颜料，脑子里会下意识开始换算：挤这么长一条大概值一块五毛钱，这块十六块五的布要是画废了，等于少吃一顿带鸡腿的猪脚饭。越这么算，手腕就越僵，调出来的颜色越脏，最后干脆放下笔去洗那两个积了三天灰的玻璃笔洗罐。

材料廉价本来是为了让人毫无心理负担地放开手脚练习，可当手头紧巴巴的时候，哪怕一块六毛五的涂抹成本都能让人在画架前面缩手缩脚。等月初刚接完一个给朋友咖啡店画黑板报的小零活、兜里进了八百块钱，那天晚上回来画起画来，刮刀往布上抹钛白都比前几天脆生不少，虽然第二天早上它照样起皮卷边掉了一地。`

          body: `【6. 结论、实践建议与致谢】

综合三周的惨痛翻车记录，得出以下四条不保证完全正确但至少能少扔几张画框的实用结论：

第一，南方梅雨季千万别在网购超低价光面画板上直接厚涂廉价丙烯。如果手头已经囤了十来张实在舍不得扔，画之前先拿400目砂纸把画布表面那层亮晶晶的假底胶粗粗打磨一遍，再刷一层稀释过的立德粉乳胶打底，起皮概率能从八成降到两成。

第二，A组那种六块八一大管的钛白，以后别买来当主色调和厚涂堆肌理了。它的唯一正确归宿是拿水稀释了刷墙补墙皮，或者拿来给木头画框涂底色，正经画画还是咬牙买一管中端牌子的钛白，一管能用半年。

第三，没钱买大型工业除湿机的话，花二十块钱买两盒氯化钙吸湿盒塞在画框堆底下，虽然接满一盒水得倒一次，但至少木框背面不至于三天长绿毛。

第四，画坏了别急着扣下来扔掉，放墙角晾三天，等起皮的地方自己卷透了用小铲子铲干净，剩下的部分拿粗砂纸打平，其实底下留着的斑驳底色比一开始干干净净的白布更好起手。

【致谢】
感谢楼下五金店王叔，在我画框松木条拧变形的时候，用他截木头剩下的边角料顺手帮我劈了八个小木楔子，收了我三块钱还送了一张砂纸。
感谢那只经常翻窗进来的狸花猫，虽然它踩毁了我样本二号的上半部分，但它趴在颜料盒盖子上打呼噜的那二十分钟，成功阻止了我把那瓶过期的松节油当成冰红茶误饮（两次）。
最后感谢这台坚持在九平米潮湿房间里没有短路报废的小台灯，尽管开关已经接触不良，拍两下还是能亮。`

        {
          label: "一 · 蓝圆珠笔",
          body: `（蓝色圆珠笔，字写得很小，行距挤得密密麻麻，纸角有一圈冰红茶瓶底印出来的湿痕）

我住这条街后面那栋没有电梯的老破小四楼，每天晚上十一点半收摊从修理铺骑车回来，都会在巷口那台绿色的旧自动贩卖机前面停一分钟。

那台机器估计是上个世纪末的遗物了，玻璃门里面永远缺货，三排饮料槽空了一半，只剩最底下那排的冬瓜茶、老牌橘子汽水和一种没人买的黑凉茶常年亮着灯。投币口吃硬币吃得特别挑，塞进去一个一块钱硬币，十次有八次“哐啷”一下从退币口掉出来。只有微信扫码还能凑合用。

上个月头一回发现这个秘密纯属巧合。那天刚修完一辆扎破内胎的三轮车，手里全是黑机油，扫码买了一瓶三块钱的冬瓜茶。机器里面齿轮咔哒咔哒响了五秒，出货口黑漆漆的，毛都没有掉下来。我等了一分钟，又按了两下退币键，还是没动静。心里一火，抬起右脚穿着劳保鞋对着机器左下角离地十厘米那块铁皮踹了一脚——没用全力，就平时踹开生锈卷帘门那种力道。

“咣当”一声，掉下来两罐。一罐冬瓜茶，一罐橘子汽水。

当时我蹲在出货口前面愣了半天，拿着两罐冰铁皮左右张望，凌晨街上一个鬼影都没有，只有对面洗浴中心的霓虹灯牌坏了一个字，一闪一闪发红光。我琢磨着可能是上回谁买卡在滑道里的橘子汽水被我一脚震下来了，心安理得揣进兜里骑车回家。

谁知道隔了四天我又去买冬瓜茶，机器照样卡壳。我照着同一个位置又踢了一脚，又掉出来两罐，这回两罐全是我刚点的冬瓜茶。这下我明白了，这台机器的滑道挡板弹簧大概松了，或者计重传感器早就坏掉，扫码扣完一份钱之后，只要给它左下角补上一脚物理震动，它就顺手把上面压着的那罐一块放出来。

从那天起我养成个坏毛病，半夜口渴了老想着去那台机器碰碰运气。头两次占便宜心里还挺美，觉得白嫖一罐饮料挺解压；踢到第五次的时候，心里反倒有点发虚，生怕哪天后台补货的师傅调监控看见我半夜三更穿个油渍工作服像个傻子一样对着铁皮箱子练扫堂腿。

昨天晚上十一点五十，我刚停好电动车走过去，发现机器前面已经站着一个人。是个穿睡衣拖鞋、牵着一条胖柯基的大哥。那大哥手里正拿着手机扫码，扫完等了三秒，出货口没响，他非常熟练地往后退半步，抬起右脚穿着塑料拖鞋对着左下角同一个位置“咚”地蹬了一脚。

铁皮箱子里头“哐当、哐当”连着响了两声。大哥弯腰从出货口掏出两瓶黑凉茶，直起身一扭头正撞见站在路灯底下的我。

空气凝固了大概三秒钟。胖柯基走过来闻了闻我的裤脚。

大哥低头看了看手里的两瓶凉茶，又看了看我，清了清嗓子把其中一瓶塞进我手里：“哥们，这机器最近弹簧又松了，喝凉茶不？清热降火。”

我接过来拧开喝了一口，苦得舌根发麻，嘴里说“谢谢啊”。大哥拉着狗绳走了两步又回头交代了一句：“下次别踹太重，前天晚上不知道谁一脚给它踢断电了，第二天下午才修好，害我白喝两天自来水。”`

          label: "二 · 黑水笔",
          body: `（黑色中性笔，划掉重写的地方很多，写到后半段换了一支偏干的红笔补了最后两行）

其实我知道《夜航九九四》那个电台节目两年前就停播了。现在那个调频波段晚上十二点之后全在放卖某种风湿贴膏药的录播广告，两个声音假得要命的主持人一唱一和，听三分钟能让人把收音机从阳台扔下去。

可我前天收拾书柜底层，把当年上高中时买的那台德生小收音机翻了出来，换上两节新买的五号电池，居然还能响。天线断了一截，我拿一段剥掉外皮的旧网线铜丝拧在上面凑合延长，蹲在出租屋阳台的塑料凳上拧旋钮。

半夜一点半，城市底噪低下来了，调频波段在几个台之间“沙沙沙”地刮过。拧到九十九点四兆赫左右的时候，原本该放膏药广告的频率不知道为什么没信号，只剩一片像下雨一样的白噪音。偶尔能听见极其微弱的出租车电台串台声，不知道哪家车队的调度员带着困意喊了一句：“东站南口有没有空车，过来拉一趟机场。”

我坐在冷风里听了二十分钟出租车调度，突然特别想给当年那个电台主持人写几句话。

那时候高三晚自习十点半放学，骑自行车回家要经过一条两边全是老杨树的土路，路灯隔三盏坏两盏。我把收音机塞在羽绒服左胸口袋里，扯一根单边耳机塞进左耳朵（右耳朵留着听后面有没有大货车鸣笛）。主持人叫老陆，声音有点哑，好像永远抽着烟在直播间里说话。他从来不念那些肉麻的青春伤痛来信，每次听众发短信抱怨模拟考砸了或者失恋了，他就在那头嗤笑一声，说“才考四百五哭啥，我当年复读那会儿数学卷子发下来连大题第一问都看不懂，现在不也照样在这儿骗你们听歌嘛”。

有一回下大雪，晚自习提前半小时放人。我推着车在雪地里走了四十分钟，鞋袜全湿透了，冻得脚趾头没知觉。那天节目里老陆放了一首不知道谁唱的粤语老歌，唱到一半突然切了麦，说直播间楼下夜宵摊的大爷今天收摊早，他刚才偷偷溜下去买烤红薯结果扑了个空，现在直播间里只有半袋凉掉的苏打饼干。说着话筒里传来“咔嚓咔嚓”嚼饼干的声音，嚼了足足有十秒钟没人说话。

我当时站在雪地里推着车听他嚼了十秒饼干，突然就不怎么觉得冷了。

前几天在便利店买关东煮，看见旁边桌上有这个本子，顺手写这几行字的时候，突然想起来我其实连老陆长什么样都不知道。前两年听说音乐台改制，深夜档全换成了自动播放曲库，他大概早就转去干别的，说不定现在在某个小区门口开了一家五金店或者茶叶铺，每天傍晚准时收摊回家吃晚饭。

要是哪天晚上再有人把收音机拧到九九点四，听见的全是“东站南口有没有空车”，也挺好的，至少那帮开夜班车的师傅还醒着，没把整条街丢给黑夜。（后面红笔补：写完这段出去吃了个蛋炒饭，回来发现天边有点亮了，刚才那碗关东煮的萝卜真甜。）`

          label: "三 · 铅笔",
          body: `（2B铅笔写的，中间夹着一张画得很糙的小冰箱结构图）

凌晨一点四十，房东叫人拖走那台坏了的旧冰箱之前，我得自己动手把里面积了至少半年的霜铲掉，不然明天楼下收废品的师傅不肯搬，说化一地水弄脏人家三轮车斗。

这台双门小冰箱是我三年前刚搬进来时花二百六十块钱从隔壁楼一个毕业搬走的学生手里收的。第一年制冷还算正常，就是压缩机半夜启动的时候像有一只老青蛙蹲在床底下打呼噜。第二年夏天不知道哪天开始，冷藏室背板每天结出一层亮晶晶的白冰，到了今年开春，冷冻室上面那格已经彻底被一座厚冰山占领了，抽屉拉都拉不开，跟焊死了一样。

断电半小时之后，我拿了一把不锈钢炒菜铲子、一只塑料洗脚盆和一条旧毛巾，蹲在客厅瓷砖地上开始了漫长的开荒。

前十分钟全是硬仗。冰块硬得像水泥，铲子使劲往缝里撬，一不小心就会发出吓人的“咔吧”声，生怕一铲子下去把隐藏在塑料壁后面的制冷铜管戳漏气。只好拿矿泉水瓶装满热水，一边往冰缝里浇，一边用毛巾接住顺着门框往外流淌的冰水。

两点零五分，最大那块冰砖终于松动，“啪叽”一声砸进塑料盆里，水花溅了一裤腿。随着冰块掉下来，冷冻室最里面那个早就打不开的角落露出了真容。

我在里面挖出了以下物品，按出土顺序记录如下：
1. 三根干瘪发黑的未知品种香肠，外皮贴在塑料袋上，像几根木乃伊；
2. 半袋前年冬天包剩下的芹菜猪肉水饺，冰冻太久水分全抽干了，面皮裂开无数条小缝，硬得能当弹弓子弹打鸟；
3. 一盒已经完全看不出生产日期的草莓味冰淇淋，揭开纸盖一看，里面塌成了一层奇怪的粉红色泡沫；
4. 最神奇的是在冰层最深处贴着背板的地方，冻着一把不锈钢小勺子。我想了十分钟才记起来，去年八月有天半夜太热，我挖冰淇淋吃的时候嫌太硬把勺子插在盒子里放回冷冻室想“等会儿再吃”，结果睡着了，第二天早上彻底忘了这回事，后来被冰层一层一层包进去封印到了今天。

把那把小勺子放在水龙头底下冲了半分钟热水，上面还残留着一点洗不掉的铁锈斑，但柄上那个小熊印花完好无损。

两点四十，全部冰块清理完毕。我拿干抹布把冰箱里里外外擦了一遍，敞着两扇门让它晾着。蹲在空荡荡的厨房地上突然发现，没有了压缩机那阵持续三年、每隔二十分钟响一次的“嗡嗡”声，这间二十五平米的出租屋居然安静得有点陌生。

明天搬去西边那个新合租屋，新房子里房东配了一台崭新的风冷无霜大冰箱。以后大概再也用不着半夜两点拿炒菜铲子撬冰山了，但刚洗出来的那把小熊不锈钢勺子，我用纸巾包好塞进了装筷子的塑料盒里，还是带走吧。`

          body: `（黑色粗马克笔与红笔交替写的对话，像在柜台边顺手记下的两人斗嘴实录）

时间：晚上九点五十五分（五金店卷帘门已经拉下来三分之二）
人物：老陈（店主，穿灰色背心，正蹲在塑料凳上嗦一碗凉掉的炸酱面）、小周（急匆匆弯腰钻进来的年轻人，手里捏着一个掉了一边腿的塑料眼镜框）

小周：叔！先别关门，救个急！你这儿有没有那种特别细、大概两毫米长的小螺丝？
老陈：（头都没抬，筷子挑起一团面）几毫米？我这儿最小的是M3的机丝，比你那眼镜腿粗一圈，拧上去能把你镜架劈成两半。
小周：（举着眼镜往前凑）刚才蹲路边系鞋带，眼镜滑下来直接砸水泥地上，那个小螺丝崩飞进下水道缝里了。我四百多度近视，明天早上还要骑车呢，没眼镜跟瞎了一样。
老陈：（咽下面条，把碗放在一摞PVC弯头上面，抹抹嘴站起来）站那儿别动。眼镜拿过来我瞅瞅。
小周：给您。是不是没救了？不行我拿透明胶带先缠两圈凑合明天去配……
老陈：（从柜台底下摸出一个生锈的月饼铁盒，打开，里面全是拆坏掉的插线板、旧门锁和乱七八糟的小零件）别拿胶带缠，胶水糊进铰链缝里到时候配镜师傅拿刷子都刷不出来。等等啊……前两个月有个小伙子在我这儿换门把手，落下过一盒修手表用的小杂件，我看看塞哪儿了。
小周：（环顾四周）叔，你这屋里东西堆得跟迷宫似的，怎么什么都能摸出来？
老陈：（低头翻铁盒）干这行二十八年，别的本事没有，就是舍不得扔破烂。你看着像废铁的东西，过半年指不定谁半夜跑来急用。嘿，找着了——（举起一个小拇指指甲盖大的透明塑料袋）看看，这里头有没有能塞进去的？
小周：（眯着眼凑近灯光）太糊了看不清……好像第二颗差不多？
老陈：你离远点坐椅子上等着，别挡着我台灯。我这老花眼加上你这近视眼，俩人凑一块儿还不如我一个人慢点摸。（拿起桌上那把柄被磨亮的小一字螺丝刀，眯起左眼，左手捏住镜框铰链）
小周：叔，你手挺稳啊。
老陈：稳啥呀，去年年底拔了颗牙，这两天晚上喝完两口小酒手还微微抖呢。也就是这颗小螺丝头上有十字槽，对准了往里旋两圈的事。哎……进去了……别说话，一说话我气儿岔了这玩意儿蹦地上找不着了……
（安静了大概二十秒，只听见外面街上便利店自动门“叮咚”响了一声）
老陈：成了。拿去戴上试试，松不松？
小周：（接过来戴上，晃了晃脑袋）严丝合缝！跟原装的一模一样！多少钱叔？我扫您微信！
老陈：（摆摆手，重新坐回塑料凳端起面碗）一颗米粒大的破螺丝收什么钱，收一毛我还不够找零的。赶紧回去吧，十点了我真拉闸睡觉了。
小周：那不行，我刚在隔壁便利店买了两瓶绿茶，放您这堆水管旁边一瓶！
老陈：放那儿吧，明天早上骑车慢点，路面刚洒过水滑。`

  function updateBookProg(){
    if(!curBookKey){
      modalProg.textContent = "";
      return;
    }
    const b = BOOKS[curBookKey];
    const st = state.bookState[curBookKey] || {
      page: 0,
      scrolls: {}
    };
    const maxS = modalBody.scrollHeight - modalBody.clientHeight;
    const pct = maxS <= 2 ? 100 : Math.min(100, Math.max(0, Math.round((modalBody.scrollTop / maxS) * 100)));
    st.scrolls[st.page] = modalBody.scrollTop;
    state.bookState[curBookKey] = st;
    modalProg.textContent = `第 ${st.page + 1}/${b.pages.length} 页 · 本页 ${pct}%`;
  }

  function renderBookPage(key, pageIdx){
    const book = BOOKS[key];
    const st = state.bookState[key] || (state.bookState[key] = {
      page: 0,
      scrolls: {},
      paper: true
    });
    st.page = Math.max(0, Math.min(book.pages.length - 1, pageIdx));
    curBookKey = key;
    const token = ++bookRenderToken;
    modal.classList.add("open", "reader");
    modal.classList.toggle("paper", !!st.paper);
    const totalChars = book.pages.reduce((s, p) => s + p.body.replace(/\s+/g, "").length, 0);
    modalTitle.textContent = book.title;
    modalMeta.textContent = book.meta + " · 全册约 " + totalChars + " 字";
    modalChaps.innerHTML = "";
    book.pages.forEach((p, idx) => {
      const cb = document.createElement("button");
      cb.className = "chap-btn" + (idx === st.page ? " on" : "");
      cb.textContent = p.label;
      cb.onclick = () => {
        sfx.play("paper");
        renderBookPage(key, idx);
      };
      modalChaps.appendChild(cb);
    });
    modalBody.textContent = book.pages[st.page].body;
    modalActs.innerHTML = "";
    const left = document.createElement("div");
    left.className = "act-left";
    const prevB = document.createElement("button");
    prevB.className = "btn";
    prevB.textContent = "← 上一页";
    prevB.disabled = (st.page === 0);
    prevB.onclick = () => {
      sfx.play("paper");
      renderBookPage(key, st.page - 1);
    };
    const nextB = document.createElement("button");
    nextB.className = "btn";
    nextB.textContent = "下一页 →";
    nextB.disabled = (st.page === book.pages.length - 1);
    nextB.onclick = () => {
      sfx.play("paper");
      renderBookPage(key, st.page + 1);
    };
    left.appendChild(prevB);
    left.appendChild(nextB);
    const right = document.createElement("div");
    right.className = "act-right";
    const themeB = document.createElement("button");
    themeB.className = "btn";
    themeB.textContent = st.paper ? "夜间底色" : "纸张底色";

      st.paper = !st.paper;
      modal.classList.toggle("paper", st.paper);
      themeB.textContent = st.paper ? "夜间底色" : "纸张底色";
    };
    const closeB = document.createElement("button");

    right.appendChild(themeB);

    modalActs.appendChild(left);
    modalActs.appendChild(right);

      if(token !== bookRenderToken || curBookKey !== key){
        return;
      }
      modalBody.scrollTop = st.scrolls[st.page] || 0;
      updateBookProg();
    });
  }

  class SoundFX{
    constructor(){
      this.ctx = null;
      this.ambGain = null;
      this.ambSrc = null;
      this.ambFilter = null;
      this._pendingSceneId = null;
      this._lastPlay = {};
    }
    init(){
      if(this.ctx){
        return;
      }
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC){
        return;
      }
      this.ctx = new AC();
      this.ambGain = this.ctx.createGain();
      this.ambGain.gain.value = 0;
      this.ambFilter = this.ctx.createBiquadFilter();
      this.ambFilter.type = "lowpass";
      this.ambFilter.frequency.value = 320;
      const buf = this.ctx.createBuffer(1, this.ctx.sampleRate * 2, this.ctx.sampleRate);
      const d = buf.getChannelData(0);
      let last = 0;
      for(let i = 0; i < d.length; i++){
        const w = Math.random() * 2 - 1;
        last = (last + 0.04 * w) / 1.04;
        d[i] = last * 2.8;
      }
      this.ambSrc = this.ctx.createBufferSource();
      this.ambSrc.buffer = buf;
      this.ambSrc.loop = true;
      this.ambSrc.connect(this.ambFilter);
      this.ambFilter.connect(this.ambGain);
      this.ambGain.connect(this.ctx.destination);
      this.ambSrc.start();
      if(this._pendingSceneId){
        this.setAmbient(this._pendingSceneId);
      }
    }
    resume(){
      if(!state.audioOn){
        return;
      }
      this.init();
      if(this.ctx && this.ctx.state === "suspended"){
        this.ctx.resume();
      }
    }
    setAmbient(sceneId){
      this._pendingSceneId = sceneId;
      if(state.audioOn && !this.ctx){
        this.init();
      }
      if(state.audioOn && this.ctx && this.ctx.state === "suspended"){
        this.ctx.resume();
      }
      if(!this.ctx || !this.ambGain){
        return;
      }
      const now = this.ctx.currentTime;
      if(!state.audioOn){
        this.ambGain.gain.setTargetAtTime(0, now, 0.2);
        return;
      }
      const cfg = {
        platform: [520, 0.08],
        hellstone: [160, 0.09],
        office: [240, 0.025],
        mall: [440, 0.045],
        garage: [140, 0.04],
        infirmary: [300, 0.018],
        school_bbq: [480, 0.04],
        zigzag: [620, 0.035],
        park_lot: [700, 0.04],
        hospital: [190, 0.03],
        airport: [350, 0.05],
        waterpark: [820, 0.065],
        convenience: [280, 0.025],
        roadwork: [520, 0.05],
        subway: [210, 0.075],
        studio: [380, 0.018],
        cave: [130, 0.055]
      }[sceneId] || [300, 0.03];
      this.ambFilter.frequency.setTargetAtTime(cfg[0], now, 0.4);
      this.ambGain.gain.setTargetAtTime(cfg[1], now, 0.4);
    }
    step(surface){
      if(!state.audioOn || !this.ctx){
        return;
      }
      const t = this.ctx.currentTime;
      const o = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      const f = this.ctx.createBiquadFilter();
      let freq = 110;
      let dur = 0.07;
      let vol = 0.06;
      let cut = 550;
      if(surface === "wood"){
        freq = 150;
        dur = 0.08;
        vol = 0.08;
      }else if(surface === "metal"){
        freq = 240;
        dur = 0.09;
        vol = 0.06;
      }else if(surface === "water"){
        freq = 420;
        dur = 0.11;
        vol = 0.05;
        cut = 1200;
      }else if(surface === "grass"){
        freq = 85;
        dur = 0.06;
        vol = 0.035;
      }else if(surface === "carpet"){
        freq = 70;
        dur = 0.055;
        vol = 0.025;
        cut = 260;
      }else if(surface === "dirt"){
        freq = 92;
        dur = 0.07;
        vol = 0.045;
        cut = 380;
      }
      o.type = surface === "water" ? "sine" : "triangle";
      o.frequency.setValueAtTime(freq * (0.92 + Math.random() * 0.16), t);
      o.frequency.exponentialRampToValueAtTime(40, t + dur);
      f.type = "lowpass";
      f.frequency.value = cut;
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(f);
      f.connect(g);
      g.connect(this.ctx.destination);
      o.start(t);
      o.stop(t + dur);
    }
    play(type){
      if(!state.audioOn){
        return;
      }
      const nowMs = performance.now();
      if(this._lastPlay[type] && nowMs - this._lastPlay[type] < 140){
        return;
      }
      this._lastPlay[type] = nowMs;
      this.resume();
      if(!this.ctx){
        return;
      }
      const t = this.ctx.currentTime;
      const tone = (freq, dur, tp = "sine", vol = 0.08, slide = null) => {
        const o = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        o.type = tp;
        o.frequency.setValueAtTime(freq, t);
        if(slide){
          o.frequency.exponentialRampToValueAtTime(slide, t + dur);
        }
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + dur);
        o.connect(g);
        g.connect(this.ctx.destination);
        o.start(t);
        o.stop(t + dur);
      };
      if(type === "switch"){
        tone(680, 0.06, "square", 0.04, 420);
      }else if(type === "bell"){
        tone(1320, 0.45, "sine", 0.09);
        setTimeout(() => tone(1980, 0.35, "sine", 0.04), 20);
      }else if(type === "chime"){
        tone(880, 0.28, "sine", 0.07);
        setTimeout(() => tone(1108, 0.35, "sine", 0.06), 110);
      }else if(type === "paper"){
        tone(340, 0.09, "triangle", 0.04, 520);
      }else if(type === "door"){
        tone(95, 0.35, "sawtooth", 0.05, 58);
      }else if(type === "splash"){
        tone(280, 0.22, "sine", 0.08, 740);
      }else if(type === "collect"){
        tone(587, 0.12, "sine", 0.07);
        setTimeout(() => tone(880, 0.24, "sine", 0.08), 90);
      }else if(type === "wood"){
        tone(190, 0.11, "triangle", 0.09, 110);
      }else if(type === "train"){
        tone(72, 0.7, "sawtooth", 0.06, 64);
      }else if(type === "sizzle"){
        tone(920, 0.18, "sawtooth", 0.03, 400);
      }else if(type === "paint"){
        tone(310, 0.08, "sine", 0.04, 220);
      }else if(type === "cat"){
        tone(520, 0.22, "sine", 0.05, 680);
      }else{
        tone(460, 0.1, "sine", 0.06);
      }
    }
  }

  const sfx = new SoundFX();

  function makeTexCache(){
    const cache = new Map();
    const maxSize = 160;
    function get(key, w, h, drawFn){
      if(cache.has(key)){
        return cache.get(key);
      }
      const c = document.createElement("canvas");
      c.width = w;
      c.height = h;
      drawFn(c.getContext("2d"), w, h);
      const t = new THREE.CanvasTexture(c);
      t.wrapS = t.wrapT = THREE.RepeatWrapping;
      if(cache.size >= maxSize){
        const fk = cache.keys().next().value;
        const ft = cache.get(fk);
        cache.delete(fk);
        if(ft && ft.dispose){
          ft.dispose();
        }
      }
      cache.set(key, t);
      return t;
    }
    function concrete(base = "#8a8b88", wear = 0.14, key = "conc"){
      return get(key + base, 256, 256, (g, w, h) => {
        g.fillStyle = base;
        g.fillRect(0, 0, w, h);
        for(let i = 0; i < 2000; i++){
          const a = Math.random() * wear;
          g.fillStyle = Math.random() > 0.5 ? `rgba(255,255,255,${a})` : `rgba(20,20,18,${a * 1.2})`;
          g.fillRect(Math.random() * w, Math.random() * h, 1 + Math.random() * 3, 1 + Math.random() * 3);
        }
        g.strokeStyle = "rgba(25,25,22,0.12)";
        g.lineWidth = 1;
        for(let i = 0; i < 5; i++){
          g.beginPath();
          let x = Math.random() * w;
          let y = Math.random() * h;
          g.moveTo(x, y);
          for(let s = 0; s < 4; s++){
            x += (Math.random() - 0.5) * 45;
            y += (Math.random() - 0.5) * 45;
            g.lineTo(x, y);
          }
          g.stroke();
        }
      });
    }
    function tiles(c1 = "#d7d5ce", c2 = "#c7c4bc", line = "#9b9890", n = 4, key = "tile"){
      return get(key + c1 + n, 256, 256, (g, w, h) => {
        const s = w / n;
        for(let y = 0; y < n; y++){
          for(let x = 0; x < n; x++){
            g.fillStyle = (x + y) % 2 ? c1 : c2;
            g.fillRect(x * s, y * s, s, s);
          }
        }
        g.strokeStyle = line;
        g.lineWidth = 2;
        for(let i = 0; i <= n; i++){
          g.beginPath();
          g.moveTo(i * s, 0);
          g.lineTo(i * s, h);
          g.stroke();
          g.beginPath();
          g.moveTo(0, i * s);
          g.lineTo(w, i * s);
          g.stroke();
        }
        for(let i = 0; i < 300; i++){
          g.fillStyle = `rgba(0,0,0,${Math.random() * 0.05})`;
          g.fillRect(Math.random() * w, Math.random() * h, 3, 3);
        }
      });
    }
    function wood(base = "#8c6844", dark = "#66482b", key = "wood"){
      return get(key + base, 256, 256, (g, w, h) => {
        g.fillStyle = base;
        g.fillRect(0, 0, w, h);
        g.strokeStyle = dark;
        for(let i = 0; i < 40; i++){
          g.globalAlpha = 0.18 + Math.random() * 0.25;
          g.lineWidth = 1 + Math.random() * 2;
          const y = Math.random() * h;
          g.beginPath();
          g.moveTo(0, y);
          g.bezierCurveTo(w * 0.3, y + (Math.random() - 0.5) * 14, w * 0.7, y + (Math.random() - 0.5) * 14, w, y + (Math.random() - 0.5) * 8);
          g.stroke();
        }
        g.globalAlpha = 1;
      });
    }
    function hazard(key = "haz"){
      return get(key, 256, 256, (g, w, h) => {
        g.fillStyle = "#d1a028";
        g.fillRect(0, 0, w, h);
        g.fillStyle = "#22211e";
        for(let i = -w; i < w * 2; i += 48){
          g.beginPath();
          g.moveTo(i, 0);
          g.lineTo(i + 24, 0);
          g.lineTo(i + 24 - h, h);
          g.lineTo(i - h, h);
          g.closePath();
          g.fill();
        }
        for(let i = 0; i < 450; i++){
          g.fillStyle = "rgba(0,0,0,0.12)";
          g.fillRect(Math.random() * w, Math.random() * h, 3, 3);
        }
      });
    }
    function sign(text, bg = "#f2ede1", fg = "#262421", sub = "", handwritten = false){
      return get("s_" + text + bg + fg + sub + handwritten, 512, 256, (g, w, h) => {
        g.fillStyle = bg;
        g.fillRect(0, 0, w, h);
        g.strokeStyle = "rgba(0,0,0,0.18)";
        g.lineWidth = 6;
        g.strokeRect(8, 8, w - 16, h - 16);
        g.fillStyle = fg;
        g.textAlign = "center";
        g.textBaseline = "middle";
        const fam = handwritten ? "'KaiTi','STKaiti',cursive,sans-serif" : "sans-serif";
        let fs = handwritten ? 42 : 40;
        g.font = `bold ${fs}px ${fam}`;
        const tw = g.measureText(text).width;
        if(tw > w - 40){
          fs = Math.max(26, Math.floor(fs * (w - 40) / tw));
          g.font = `bold ${fs}px ${fam}`;
        }
        g.fillText(text, w / 2, sub ? h * 0.4 : h * 0.5);
        if(sub){
          let sfs = 23;
          g.font = `${sfs}px sans-serif`;
          const sw = g.measureText(sub).width;
          if(sw > w - 40){
            sfs = Math.max(14, Math.floor(sfs * (w - 40) / sw));
            g.font = `${sfs}px sans-serif`;
          }
          g.globalAlpha = 0.78;
          g.fillText(sub, w / 2, h * 0.72);
          g.globalAlpha = 1;
        }
        for(let i = 0; i < 400; i++){
          g.fillStyle = `rgba(30,25,20,${Math.random() * 0.07})`;
          g.fillRect(Math.random() * w, Math.random() * h, 2, 2);
        }
      });
    }
    function grass(c1 = "#4b6b3b", c2 = "#37522b"){
      return get("g_" + c1, 256, 256, (g, w, h) => {
        g.fillStyle = c1;
        g.fillRect(0, 0, w, h);
        for(let i = 0; i < 1800; i++){
          g.fillStyle = Math.random() > 0.45 ? c2 : "#62834b";
          g.fillRect(Math.random() * w, Math.random() * h, 2, 4 + Math.random() * 4);
        }
      });
    }
    function lava(){
      return get("lava", 256, 256, (g, w, h) => {
        g.fillStyle = "#241514";
        g.fillRect(0, 0, w, h);
        g.strokeStyle = "#d94e1f";
        g.lineWidth = 3;
        for(let i = 0; i < 16; i++){
          g.beginPath();
          let x = Math.random() * w;
          let y = Math.random() * h;
          g.moveTo(x, y);
          for(let s = 0; s < 4; s++){
            x += (Math.random() - 0.5) * 70;
            y += (Math.random() - 0.5) * 70;
            g.lineTo(x, y);
          }
          g.stroke();
        }
        g.strokeStyle = "#ff9933";
        g.lineWidth = 1;
        for(let i = 0; i < 8; i++){
          g.beginPath();
          g.moveTo(Math.random() * w, Math.random() * h);
          g.lineTo(Math.random() * w, Math.random() * h);
          g.stroke();
        }
      });
    }
    return {
      get,
      concrete,
      tiles,
      wood,
      hazard,
      sign,
      grass,
      lava
    };
  }

    function loadScene(idx){

        curBookKey = null;
      }
      closePanels();
      const meta = SCENES_META[state.sceneIdx];
      clearScene();
      let info;
      try{
        info = builders[meta.id]();
      }catch(e){
        cleanup3D();
        runFallback("场景构建失败：" + e.message);
        return;
      }
      setupShadows();
      player.pos.copy(info.pos);
      player.vel.set(0, 0, 0);
      player.yaw = info.yaw || 0;
      player.pitch = 0;
      camera.fov = state.fov;
      camera.updateProjectionMatrix();
      document.getElementById("ui-idx").textContent = String(state.sceneIdx + 1).padStart(2, "0") + "/17";
      document.getElementById("ui-name").textContent = meta.name;
      showWhisper(info.whisper, 4200);
      sfx.setAmbient(meta.id);
      updateSceneMenu();
    }

    const keys = {};
    let pointerLocked = false;
    let dragging = false;
    let lastX = 0;
    let lastY = 0;

    const onKeyDown = e => {
      keys[e.code] = true;
      if(e.code === "Escape"){
        if(modal.classList.contains("open")){
          closeModal();
          return;
        }
        closePanels();
        return;
      }
      if(state.paused){
        return;
      }
      if(e.code === "KeyE" || e.code === "Enter"){
        triggerInteract();
      }
      if(e.code === "Space"){
        e.preventDefault();
        if(document.activeElement && document.activeElement.blur){
          document.activeElement.blur();
        }
        if(sitTimer){
          clearTimeout(sitTimer);
          sitTimer = null;
          player.height = 1.65;
          player.pos.y = Math.max(player.pos.y, heightFn(player.pos.x, player.pos.z, player.pos.y - 1.65) + 1.65);
        }
        if(player.onGround){
          player.vel.y = 5.4;
          player.onGround = false;
        }
      }
      if(e.code === "BracketLeft"){
        loadScene(state.sceneIdx - 1);
      }
      if(e.code === "BracketRight"){
        loadScene(state.sceneIdx + 1);
      }
    };

    const onKeyUp = e => {
      keys[e.code] = false;
    };

    const onBlur = () => {
      for(const k in keys){
        keys[k] = false;
      }
    };

    const onMouseDown = e => {
      if(state.paused){
        return;
      }
      sfx.resume();
      if(e.button === 0){
        if(!pointerLocked){
          if(canvas.requestPointerLock){
            canvas.requestPointerLock();
          }
          dragging = true;
          lastX = e.clientX;
          lastY = e.clientY;
        }else{
          triggerInteract();
        }
      }
    };

    const onMouseUp = () => {
      dragging = false;
    };

    const onMouseMove = e => {
      if(state.paused){
        return;
      }
      if(pointerLocked){
        player.yaw -= e.movementX * 0.0022;
        player.pitch = Math.max(-1.35, Math.min(1.35, player.pitch - e.movementY * 0.0022));
      }else if(dragging){
        const dx = e.clientX - lastX;
        const dy = e.clientY - lastY;
        lastX = e.clientX;
        lastY = e.clientY;
        player.yaw -= dx * 0.004;
        player.pitch = Math.max(-1.35, Math.min(1.35, player.pitch - dy * 0.004));
      }
    };

    const onPtrChange = () => {
      pointerLocked = document.pointerLockElement === canvas;
    };

    const onPtrErr = () => {
      showWhisper("视角锁定被浏览器拒绝，可继续按住鼠标左键拖动环视。");
    };

    let lookTouchId = null;
    let lookLX = 0;
    let lookLY = 0;

    const onCTouchStart = e => {
      if(e.target !== canvas || state.paused){
        return;
      }
      sfx.resume();
      for(const t of e.changedTouches){
        if(lookTouchId === null){
          lookTouchId = t.identifier;
          lookLX = t.clientX;
          lookLY = t.clientY;
        }
      }
    };

    const onCTouchMove = e => {
      if(e.target !== canvas || state.paused){
        return;
      }
      for(const t of e.changedTouches){
        if(t.identifier === lookTouchId){
          const dx = t.clientX - lookLX;
          const dy = t.clientY - lookLY;
          lookLX = t.clientX;
          lookLY = t.clientY;
          player.yaw -= dx * 0.0055;
          player.pitch = Math.max(-1.35, Math.min(1.35, player.pitch - dy * 0.0055));
        }
      }
    };

    const onCTouchEnd = e => {
      for(const t of e.changedTouches){
        if(t.identifier === lookTouchId){
          lookTouchId = null;
        }
      }
    };

    const joyZone = document.getElementById("joy-zone");
    const joyKnob = document.getElementById("joy-knob");
    let joyId = null;

    function updateJoy(cx, cy){
      const r = joyZone.getBoundingClientRect();
      let dx = cx - (r.left + r.width / 2);
      let dy = cy - (r.top + r.height / 2);
      const max = 38;
      const d = Math.hypot(dx, dy);
      if(d > max){
        dx = dx / d * max;
        dy = dy / d * max;
      }
      joyKnob.style.transform = `translate(${dx}px,${dy}px)`;
      joyVec.x = dx / max;
      joyVec.y = dy / max;
    }

    const onJStart = e => {
      if(state.paused){
        return;
      }
      e.stopPropagation();
      e.preventDefault();
      sfx.resume();
      const t = e.changedTouches[0];
      joyId = t.identifier;
      updateJoy(t.clientX, t.clientY);
    };

    const onJMove = e => {
      if(state.paused){
        return;
      }
      e.stopPropagation();
      e.preventDefault();
      for(const t of e.changedTouches){
        if(t.identifier === joyId){
          updateJoy(t.clientX, t.clientY);
        }
      }
    };

    const onJEnd = e => {
      e.stopPropagation();
      for(const t of e.changedTouches){
        if(t.identifier === joyId){
          joyId = null;
          joyVec.x = 0;
          joyVec.y = 0;
          joyKnob.style.transform = "";
        }
      }
    };

    const onJCancel = e => {
      e.stopPropagation();
      joyId = null;
      joyVec.x = 0;
      joyVec.y = 0;
      joyKnob.style.transform = "";
    };

    const touchAct = document.getElementById("touch-act");
    const touchJump = document.getElementById("touch-jump");
    const promptEl = document.getElementById("prompt");

    function doJump(){
      if(!state.paused){
        if(sitTimer){
          clearTimeout(sitTimer);
          sitTimer = null;
          player.height = 1.65;
          player.pos.y = Math.max(player.pos.y, heightFn(player.pos.x, player.pos.z, player.pos.y - 1.65) + 1.65);
        }
        if(player.onGround){
          player.vel.y = 5.4;
          player.onGround = false;
        }
      }
    }

    function triggerInteract(){
      if(state.paused){
        return;
      }
      const now = performance.now();
      if(now - lastInteractTime < 300){
        return;
      }
      lastInteractTime = now;
      if(targetInter){
        targetInter.onInteract();
      }
    }

    const onActTouch = e => {
      e.preventDefault();
      e.stopPropagation();
      sfx.resume();
      triggerInteract();
    };

    const onActClick = e => {
      e.stopPropagation();
      sfx.resume();
      triggerInteract();
    };

    const onJumpTouch = e => {
      e.preventDefault();
      e.stopPropagation();
      doJump();
    };

    const onJumpClick = e => {
      e.stopPropagation();
      doJump();
    };

    const onPromptClick = e => {
      e.stopPropagation();
      triggerInteract();
    };

    function resize(){
      const pr = Math.min(window.devicePixelRatio || 1, 2) * state.resScale;
      renderer.setPixelRatio(pr);
      renderer.setSize(window.innerWidth, window.innerHeight);
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
    }

    const mq = window.matchMedia ? matchMedia("(resolution: " + devicePixelRatio + "dppx)") : null;

    window.addEventListener("keydown", onKeyDown);
    window.addEventListener("keyup", onKeyUp);
    window.addEventListener("blur", onBlur);
    canvas.addEventListener("mousedown", onMouseDown);
    window.addEventListener("mouseup", onMouseUp);
    window.addEventListener("mousemove", onMouseMove);
    document.addEventListener("pointerlockchange", onPtrChange);
    document.addEventListener("pointerlockerror", onPtrErr);
    canvas.addEventListener("touchstart", onCTouchStart, {
      passive: true
    });
    canvas.addEventListener("touchmove", onCTouchMove, {
      passive: true
    });
    canvas.addEventListener("touchend", onCTouchEnd);
    joyZone.addEventListener("touchstart", onJStart, {
      passive: false
    });
    joyZone.addEventListener("touchmove", onJMove, {
      passive: false
    });
    joyZone.addEventListener("touchend", onJEnd);
    joyZone.addEventListener("touchcancel", onJCancel);
    touchAct.addEventListener("touchstart", onActTouch, {
      passive: false
    });
    touchAct.addEventListener("click", onActClick);
    touchJump.addEventListener("touchstart", onJumpTouch, {
      passive: false
    });
    touchJump.addEventListener("click", onJumpClick);
    promptEl.addEventListener("click", onPromptClick);
    window.addEventListener("resize", resize);
    if(mq){
      mq.addEventListener("change", resize);
    }
    resize();

    function cleanup3D(){
      alive = false;
      clearScene();
      window.removeEventListener("keydown", onKeyDown);
      window.removeEventListener("keyup", onKeyUp);
      window.removeEventListener("blur", onBlur);
      canvas.removeEventListener("mousedown", onMouseDown);
      window.removeEventListener("mouseup", onMouseUp);
      window.removeEventListener("mousemove", onMouseMove);
      document.removeEventListener("pointerlockchange", onPtrChange);
      document.removeEventListener("pointerlockerror", onPtrErr);
      canvas.removeEventListener("touchstart", onCTouchStart);
      canvas.removeEventListener("touchmove", onCTouchMove);
      canvas.removeEventListener("touchend", onCTouchEnd);
      joyZone.removeEventListener("touchstart", onJStart);
      joyZone.removeEventListener("touchmove", onJMove);
      joyZone.removeEventListener("touchend", onJEnd);
      joyZone.removeEventListener("touchcancel", onJCancel);
      touchAct.removeEventListener("touchstart", onActTouch);
      touchAct.removeEventListener("click", onActClick);
      touchJump.removeEventListener("touchstart", onJumpTouch);
      touchJump.removeEventListener("click", onJumpClick);
      promptEl.removeEventListener("click", onPromptClick);
      window.removeEventListener("resize", resize);
      if(mq){
        mq.removeEventListener("change", resize);
      }
      renderer.dispose();
      canvas.style.display = "none";
      window._clearHover = null;
    }

    const reticle = document.getElementById("reticle");

    function findInteractable(){
      _lookEuler.set(player.pitch, player.yaw, 0, "YXZ");
      _lookDir.set(0, 0, -1).applyEuler(_lookEuler);
      const closeThresh = 0.6;
      let best = null;
      let bestScore = -1;
      for(const it of interactables){
        _tmpVec.copy(it.pos).sub(player.pos);
        const dist = _tmpVec.length();
        if(dist > it.radius + 0.8){
          continue;
        }
        const dot = _tmpVec.normalize().dot(_lookDir);
        if(dot > 0.44 || dist < closeThresh){
          const score = dot * 2 - dist * 0.25;
          if(score > bestScore){
            bestScore = score;
            best = it;
          }
        }
      }
      if(targetInter && targetInter !== best){
        restoreHover(targetInter);
      }
      targetInter = best;
      if(best){
        if(best.mesh){
          const m = best.mesh.material;
          if(m && "emissiveIntensity" in m){
            if(best.mesh.userData._origEm === undefined){
              best.mesh.userData._origEm = m.emissiveIntensity;
            }
            if(m.emissive && best.mesh.userData._origEmColor === undefined){
              best.mesh.userData._origEmColor = m.emissive.getHex();
            }
            if(m.emissive && m.emissive.getHex() === 0){
              m.emissive.setHex(0x443a28);
            }
            m.emissiveIntensity = Math.max(best.mesh.userData._origEm, 0.2) + 0.35;
          }
          if(!best.mesh.userData._origScale){
            best.mesh.userData._origScale = best.mesh.scale.clone();
          }
          best.mesh.scale.copy(best.mesh.userData._origScale).multiplyScalar(1.1);
        }
        const lbl = best.getLabel ? best.getLabel() : best.label;
        const hnt = best.getHint ? best.getHint() : best.hint;
        reticle.classList.add("hit");
        promptEl.textContent = "[E] " + lbl + " · " + hnt;
        promptEl.classList.add("show");
      }else{
        reticle.classList.remove("hit");
        promptEl.classList.remove("show");
      }
    }

    const mm = document.getElementById("minimap").getContext("2d");
    let lastMapMs = 0;

    function drawMinimap(now){
      if(now - lastMapMs < 42){
        return;
      }
      lastMapMs = now;
      mm.clearRect(0, 0, 128, 128);
      mm.fillStyle = "rgba(22,24,28,0.75)";
      mm.fillRect(0, 0, 128, 128);
      const scale = 3.6;
      const cx = 64;
      const cy = 64;
      mm.fillStyle = "rgba(160,165,170,0.28)";
      for(const c of colliders){
        if(!c.active){
          continue;
        }
        if(Math.abs(c.minX - player.pos.x) > 12 || Math.abs(c.minZ - player.pos.z) > 12){
          continue;
        }
        mm.fillRect(cx + (c.minX - player.pos.x) * scale, cy + (c.minZ - player.pos.z) * scale, (c.maxX - c.minX) * scale, (c.maxZ - c.minZ) * scale);
      }
      for(const it of interactables){
        mm.fillStyle = it.id.startsWith("col_") ? "#e6c373" : "#7ec4cf";
        mm.beginPath();
        mm.arc(cx + (it.pos.x - player.pos.x) * scale, cy + (it.pos.z - player.pos.z) * scale, 2.6, 0, Math.PI * 2);
        mm.fill();
      }
      mm.save();
      mm.translate(cx, cy);
      mm.rotate(-player.yaw);
      mm.fillStyle = "rgba(235,220,185,0.28)";
      mm.beginPath();
      mm.moveTo(0, 0);
      mm.lineTo(-10, -22);
      mm.lineTo(10, -22);
      mm.closePath();
      mm.fill();
      mm.fillStyle = "#f2ead8";
      mm.beginPath();
      mm.arc(0, 0, 3.2, 0, Math.PI * 2);
      mm.fill();
      mm.restore();
    }

    function resolveMove(nx, nz){
      const STEP = 0.45;
      const r = 0.35;
      let x = Math.max(bounds.minX, Math.min(bounds.maxX, nx));
      let z = Math.max(bounds.minZ, Math.min(bounds.maxZ, nz));
      const py = player.pos.y - player.height;
      for(const c of colliders){
        if(!c.active || py + STEP > c.maxY || py + player.height < c.minY){
          continue;
        }
        if(x + r > c.minX && x - r < c.maxX && z + r > c.minZ && z - r < c.maxZ){
          const ox1 = (x + r) - c.minX;
          const ox2 = c.maxX - (x - r);
          const oz1 = (z + r) - c.minZ;
          const oz2 = c.maxZ - (z - r);
          const minO = Math.min(ox1, ox2, oz1, oz2);
          if(minO === ox1){
            x = c.minX - r;
          }else if(minO === ox2){
            x = c.maxX + r;
          }else if(minO === oz1){
            z = c.minZ - r;
          }else{
            z = c.maxZ + r;
          }
        }
      }
      return [x, z];
    }

    const clock = new T.Clock();
    let stepAcc = 0;

    function animate(now){
      if(!alive){
        return;
      }
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);
      const t = clock.elapsedTime;
      if(!state.paused){
        let fwd = 0;
        let str = 0;
        if(keys["KeyW"] || keys["ArrowUp"]){
          fwd += 1;
        }
        if(keys["KeyS"] || keys["ArrowDown"]){
          fwd -= 1;
        }
        if(keys["KeyA"] || keys["ArrowLeft"]){
          str -= 1;
        }
        if(keys["KeyD"] || keys["ArrowRight"]){
          str += 1;
        }
        fwd -= joyVec.y;
        str += joyVec.x;
        const len = Math.hypot(fwd, str);
        if(len > 1){
          fwd /= len;
          str /= len;
        }
        const speed = keys["ShiftLeft"] ? 6.4 : 4.1;
        const sinY = Math.sin(player.yaw);
        const cosY = Math.cos(player.yaw);
        const [nx, nz] = resolveMove(player.pos.x + (-sinY * fwd + cosY * str) * speed * dt, player.pos.z + (-cosY * fwd - sinY * str) * speed * dt);
        const moved = Math.hypot(nx - player.pos.x, nz - player.pos.z);
        player.pos.x = nx;
        player.pos.z = nz;
        if(sitTimer && (moved > 0.005 || len > 0.05)){
          clearTimeout(sitTimer);
          sitTimer = null;
          player.height = 1.65;
        }
        const groundY = heightFn(player.pos.x, player.pos.z, player.pos.y - player.height);
        player.vel.y -= 14.5 * dt;
        player.pos.y += player.vel.y * dt;
        if(player.pos.y <= groundY + player.height){
          if(Math.abs(player.pos.y - (groundY + player.height)) < 0.35){
            player.pos.y += ((groundY + player.height) - player.pos.y) * Math.min(1, dt * 18);
          }else{
            player.pos.y = groundY + player.height;
          }
          player.vel.y = 0;
          player.onGround = true;
        }
        if(moved > 0.005 && player.onGround){
          stepAcc += moved;
          if(stepAcc > 1.45){
            stepAcc = 0;
            sfx.step(surfaceFn(player.pos.x, player.pos.z));
          }
        }
        const bob = moved > 0.005 && player.onGround ? Math.sin(t * 10) * 0.032 : 0;
        camera.position.set(player.pos.x, player.pos.y + bob, player.pos.z);
        camera.rotation.order = "YXZ";
        camera.rotation.y = player.yaw;
        camera.rotation.x = player.pitch;
        updaters.forEach(u => u(dt, t));
        findInteractable();
        drawMinimap(now || performance.now());
      }
      renderer.render(scene, camera);
    }

    window._engine = {
      loadScene,
      setRes(v){
        state.resScale = v;
        resize();
      },
      setPerf(v){
        state.perf = v;
        renderer.shadowMap.enabled = (v === "high");
      },
      setFov(v){
        state.fov = v;
        if(!state.zoomActive){
          camera.fov = v;
          camera.updateProjectionMatrix();
        }
      }
    };

    loadScene(state.sceneIdx);
    requestAnimationFrame(animate);
    setTimeout(() => {
      const el = document.getElementById("loader");
      el.classList.add("hide");
      setTimeout(() => el.style.display = "none", 500);
    }, 260);
  }

  function runFallback(msg){
    const fc = document.getElementById("fallback");
    fc.style.display = "block";
    document.getElementById("minimap-wrap").style.display = "none";
    const retryBtn = document.getElementById("fb-retry");
    retryBtn.style.display = "inline-flex";
    const g = fc.getContext("2d");

    function fit(){
      fc.width = window.innerWidth;
      fc.height = window.innerHeight;
    }

    fit();
    let px = 0;
    let py = 0;
    let joyId = null;
    let fbAlive = true;
    let dragId = null;
    let lx = 0;
    let ly = 0;
    const joyZone = document.getElementById("joy-zone");
    const joyKnob = document.getElementById("joy-knob");
    const keys = {};

    function updJ(cx, cy){
      const r = joyZone.getBoundingClientRect();
      let dx = cx - (r.left + r.width / 2);
      let dy = cy - (r.top + r.height / 2);
      const max = 38;
      const d = Math.hypot(dx, dy);
      if(d > max){
        dx = dx / d * max;
        dy = dy / d * max;
      }
      joyKnob.style.transform = `translate(${dx}px,${dy}px)`;
      joyVec.x = dx / max;
      joyVec.y = dy / max;
    }

    const onJStart = e => {
      if(state.paused){
        return;
      }
      e.stopPropagation();
      e.preventDefault();
      const t = e.changedTouches[0];
      joyId = t.identifier;
      updJ(t.clientX, t.clientY);
    };

    const onJMove = e => {
      if(state.paused){
        return;
      }
      e.stopPropagation();
      e.preventDefault();
      for(const t of e.changedTouches){
        if(t.identifier === joyId){
          updJ(t.clientX, t.clientY);
        }
      }
    };

    const onJEnd = e => {
      e.stopPropagation();
      joyId = null;
      joyVec.x = 0;
      joyVec.y = 0;
      joyKnob.style.transform = "";
    };

    const onFStart = e => {
      const t = e.changedTouches[0];
      dragId = t.identifier;
      lx = t.clientX;
      ly = t.clientY;
    };

    const onFMove = e => {
      for(const t of e.changedTouches){
        if(t.identifier === dragId){
          px += (t.clientX - lx) * 0.6;
          py += (t.clientY - ly) * 0.6;
          lx = t.clientX;
          ly = t.clientY;
        }
      }
    };

    const onFEnd = () => {
      dragId = null;
    };

    const onKeyDown = e => {
      keys[e.code] = true;
      if(e.code === "Escape"){
        if(modal.classList.contains("open")){
          closeModal();
        }else{
          closePanels();

      }
      if(!state.paused && e.code === "KeyE"){
        const m = SCENES_META[state.sceneIdx].id;
        if(BOOKS[m]){

    };

    const onKeyUp = e => {

    const onBlur = () => {
      for(const k in keys){

    const touchAct = document.getElementById("touch-act");
    const touchJump = document.getElementById("touch-jump");

    const onActTouch = e => {
      e.preventDefault();
      e.stopPropagation();
      if(!state.paused){
        const m = SCENES_META[state.sceneIdx].id;
        if(BOOKS[m]){
          openBook(m);
        }
      }
    };

    const onActClick = () => {
      if(!state.paused){
        const m = SCENES_META[state.sceneIdx].id;
        if(BOOKS[m]){
          openBook(m);
        }
      }
    };

    const onJumpTouch = e => {
      e.preventDefault();
      e.stopPropagation();
    };

    window.addEventListener("resize", fit);
    joyZone.addEventListener("touchstart", onJStart, {
      passive: false
    });
    joyZone.addEventListener("touchmove", onJMove, {
      passive: false
    });
    joyZone.addEventListener("touchend", onJEnd);
    fc.addEventListener("touchstart", onFStart, {
      passive: true
    });
    fc.addEventListener("touchmove", onFMove, {
      passive: true
    });
    fc.addEventListener("touchend", onFEnd);
    window.addEventListener("keydown", onKeyDown);
    window.addEventListener("keyup", onKeyUp);
    window.addEventListener("blur", onBlur);
    touchAct.addEventListener("touchstart", onActTouch, {
      passive: false
    });
    touchAct.addEventListener("click", onActClick);
    touchJump.addEventListener("touchstart", onJumpTouch, {
      passive: false
    });

    function cleanup(){
      fbAlive = false;
      window.removeEventListener("resize", fit);
      joyZone.removeEventListener("touchstart", onJStart);
      joyZone.removeEventListener("touchmove", onJMove);
      joyZone.removeEventListener("touchend", onJEnd);
      fc.removeEventListener("touchstart", onFStart);
      fc.removeEventListener("touchmove", onFMove);
      fc.removeEventListener("touchend", onFEnd);
      window.removeEventListener("keydown", onKeyDown);
      window.removeEventListener("keyup", onKeyUp);
      window.removeEventListener("blur", onBlur);
      touchAct.removeEventListener("touchstart", onActTouch);
      touchAct.removeEventListener("click", onActClick);
      touchJump.removeEventListener("touchstart", onJumpTouch);
    }

    retryBtn.onclick = async () => {
      retryBtn.textContent = "加载中…";
      const ok = await ensureThree();
      if(ok){
        cleanup();
        retryBtn.textContent = "重试加载 3D";
        run3D();
      }else{
        retryBtn.textContent = "重试加载 3D";
        showWhisper("仍未找到 three.min.js");
      }
    };

    function draw(){
      if(!fbAlive){
        return;
      }
      if(!state.paused){
        if(keys["KeyW"] || keys["ArrowUp"]){
          py -= 3;
        }
        if(keys["KeyS"] || keys["ArrowDown"]){
          py += 3;
        }
        if(keys["KeyA"] || keys["ArrowLeft"]){
          px -= 3;
        }
        if(keys["KeyD"] || keys["ArrowRight"]){
          px += 3;
        }
        px += joyVec.x * 3;
        py += joyVec.y * 3;
      }
      g.fillStyle = "#181a1f";
      g.fillRect(0, 0, fc.width, fc.height);
      const meta = SCENES_META[state.sceneIdx];
      g.fillStyle = "#cbb893";
      g.font = "17px sans-serif";
      g.textAlign = "center";
      g.fillText(meta.name + "（轻量视图回退模式）", fc.width / 2, fc.height / 2 - 34);
      g.fillStyle = "#9da1a8";
      g.font = "12.5px sans-serif";
      g.fillText(msg || "请将 three.min.js 放在同级目录以启用完整 3D 场景", fc.width / 2, fc.height / 2);
      if(BOOKS[meta.id]){
        g.fillStyle = "#e2cf9e";
        g.fillText("此场景内含长篇读本，按 E 或点击右下「互动」可打开阅读", fc.width / 2, fc.height / 2 + 28);
      }
      g.fillStyle = "rgba(200,180,140,0.45)";
      g.beginPath();
      g.arc(fc.width / 2 + px, fc.height / 2 + 86 + py, 12, 0, Math.PI * 2);
      g.fill();
      requestAnimationFrame(draw);
    }

    window._engine = {
      loadScene(i){
        state.sceneIdx = (i + 17) % 17;
        if(modal.classList.contains("open")){
          closeModal();
        }else{
          curBookKey = null;
        }
        closePanels();
        px = 0;
        py = 0;
        document.getElementById("ui-idx").textContent = String(state.sceneIdx + 1).padStart(2, "0") + "/17";
        document.getElementById("ui-name").textContent = SCENES_META[state.sceneIdx].name;
        updateSceneMenu();
      },
      setRes(){},
      setPerf(){},
      setFov(){}
    };

    draw();
    setTimeout(() => {
      const el = document.getElementById("loader");
      el.classList.add("hide");
      setTimeout(() => el.style.display = "none", 500);
    }, 260);
  }

  function closePanels(){
    document.querySelectorAll(".panel").forEach(p => p.classList.remove("open"));
    state.paused = modal.classList.contains("open");
  }

  window.closePanels = closePanels;

  function togglePanel(id){
    const el = document.getElementById(id);
    const was = el.classList.contains("open");
    closePanels();
    if(!was){
      if(document.pointerLockElement){
        document.exitPointerLock();
      }
      if(window._clearHover){
        window._clearHover();
      }
      joyVec.x = 0;
      joyVec.y = 0;
      document.getElementById("joy-knob").style.transform = "";
      el.classList.add("open");
      state.paused = true;
    }
  }

  function updateSceneMenu(){
    const grid = document.getElementById("scene-grid");
    grid.innerHTML = "";
    SCENES_META.forEach((m, i) => {
      const b = document.createElement("button");
      b.className = "sc-item" + (i === state.sceneIdx ? " cur" : "");
      b.innerHTML = `<span class="sc-num">${String(i + 1).padStart(2, "0")}</span><span>${m.name}</span>`;
      b.onclick = () => {
        window._engine.loadScene(i);
        closePanels();
      };
      grid.appendChild(b);
    });
  }

  function updateColUI(){
    document.getElementById("col-count").textContent = state.collected.size + "/17";
    const list = document.getElementById("col-list");
    list.innerHTML = "";
    SCENES_META.forEach((m, i) => {
      const got = state.collected.has(m.id);
      const d = document.createElement("div");
      d.className = "col-item " + (got ? "got" : "miss");
      d.innerHTML = `<span>${String(i + 1).padStart(2, "0")} · ${got ? m.item : "未寻得"}</span><span>${got ? m.name : "?"}</span>`;
      if(got){
        d.style.cursor = "pointer";
        d.onclick = () => openModal(m.item, m.desc + "\n\n发现地：" + m.name);
      }
      list.appendChild(d);
    });
  }

  function updateTouchUI(){
    const tui = document.getElementById("touch-ui");
    if(state.touchMode === "1"){
      tui.style.display = "block";
    }else if(state.touchMode === "0"){
      tui.style.display = "none";
    }else{
      tui.style.display = ("ontouchstart" in window || navigator.maxTouchPoints > 0) ? "block" : "none";
    }
  }

  function bindSeg(id, cb){
    const wrap = document.getElementById(id);
    wrap.querySelectorAll("button").forEach(b => {
      b.onclick = () => {
        wrap.querySelectorAll("button").forEach(x => x.classList.remove("on"));
        b.classList.add("on");
        cb(b.dataset.v);
      };
    });
  }

  document.getElementById("btn-prev").onclick = () => {
    if(window._engine){
      window._engine.loadScene(state.sceneIdx - 1);
    }
    document.getElementById("prompt").classList.remove("show");
  };

  document.getElementById("btn-next").onclick = () => {
    if(window._engine){
      window._engine.loadScene(state.sceneIdx + 1);
    }
    document.getElementById("prompt").classList.remove("show");
  };

  document.getElementById("btn-scenes").onclick = () => {
    updateSceneMenu();
    togglePanel("panel-scenes");
  };

  document.getElementById("btn-col").onclick = () => {
    updateColUI();
    togglePanel("panel-col");
  };

  document.getElementById("btn-set").onclick = () => togglePanel("panel-set");

  document.getElementById("btn-reset").onclick = () => {
    if(window._engine){
      state.collected.clear();
      state.bookState = {};
      state.studioImg = null;
      state.roadBridge = false;
      state.officePage = 0;
      updateColUI();
      window._engine.loadScene(state.sceneIdx);
      sfx.play("switch");
      showWhisper("现场已恢复初始状态。");
    }
    document.getElementById("prompt").classList.remove("show");
  };

  bindSeg("seg-res", v => window._engine && window._engine.setRes(parseFloat(v)));
  bindSeg("seg-perf", v => window._engine && window._engine.setPerf(v));
  bindSeg("seg-audio", v => {
    state.audioOn = (v === "1");
    sfx.setAmbient(SCENES_META[state.sceneIdx].id);
  });
  bindSeg("seg-touch", v => {
    state.touchMode = v;
    updateTouchUI();
  });
  bindSeg("seg-fov", v => window._engine && window._engine.setFov(parseInt(v, 10)));

  updateSceneMenu();
  updateColUI();
  updateTouchUI();

  ensureThree().then(ok => {
    if(ok){
      run3D();
    }else{
      runFallback("未找到本地 ./three.min.js，已切至轻量回退模式");
    }
  });
})();
</script>
</body>
</html>
