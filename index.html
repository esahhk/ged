e"><span class="scene-idx" id="ui-idx">01/16</span><span id="ui-name">高处平台</span></div><div class="whisper" id="ui-whisper"></div></div><div class="top-right"><button class="btn" id="btn-prev" title="上一场景">◀</button><button class="btn" id="btn-next" title="下一场景">▶</button><button class="btn" id="btn-scenes">场景目录</button><button class="btn" id="btn-col">拾遗 <span id="col-count">0/16</span></button><button class="btn" id="btn-reset">恢复现场</button><button class="btn" id="btn-set">设置</button><button class="btn" id="btn-immersive">沉浸</button></div><div id="reticle"></div><div id="prompt"></div><div id="minimap-wrap"><canvas id="minimap" width="128" height="128"></canvas></div><div id="subbar">点击画面锁定视角 · WASD移动 · Space跳跃 · E或左键互动 · F沉浸 · Esc释放鼠标/关弹窗</div></div><div id="touch-ui"><div id="joy-zone"><div id="joy-knob"></div></div><div id="touch-jump">跳跃</div><div id="touch-act">互动</div></div><button id="btn-exit-imm">退出沉浸</button><button class="btn" id="fb-retry">重试加载 3D</button><div class="panel" id="panel-scenes"><h3>十七处地方 <button class="btn" onclick="closePanels()">关闭</button></h3><div class="scene-grid" id="scene-grid"></div></div><div class="panel" id="panel-col"><h3>沿途拾遗 <button class="btn" onclick="closePanels()">关闭</button></h3><div class="col-list" id="col-list"></div></div><div class="panel" id="panel-set"><h3>显示与性能 <button class="btn" onclick="closePanels()">关闭</button></h3><div class="set-row"><span>分辨率缩放</span><div class="seg" id="seg-res"><button data-v="0.6">低</button><button data-v="0.85">中</button><button data-v="1" class="on">原画</button></div></div><div class="set-row"><span>性能模式</span><div class="seg" id="seg-perf"><button data-v="high" class="on">精致阴影</button><button data-v="fast">流畅优先</button></div></div><div class="set-row"><span>环境与反馈音效</span><div class="seg" id="seg-audio"><button data-v="1" class="on">开启</button><button data-v="0">静音</button></div></div><div class="set-row"><span>触摸摇杆显示</span><div class="seg" id="seg-touch"><button data-v="auto" class="on">自动</button><button data-v="1">显示</button><button data-v="0">隐藏</button></div></div><div class="set-row"><span>视野范围</span><div class="seg" id="seg-fov"><button data-v="62">62°</button><button data-v="72" class="on">72°</button><button data-v="84">84°</button></div></div><div class="set-row"><span>沉浸模式</span><button class="btn" id="btn-set-imm">隐藏界面</button></div></div><div id="modal-backdrop"></div><div id="inspect-modal"><div id="inspect-title"></div><div id="inspect-sub"><span id="inspect-meta"></span><span id="inspect-prog"></span></div><div id="inspect-chapters"></div><div id="inspect-body"></div><div id="inspect-actions"></div></div><script>(function(){const po=["./three.min.js","./libs/three.min.js"];function ho(o){return new Promise((L,T)=>{const a=document.createElement("script");a.src=o,a.async=!0;let i=!1;const j=setTimeout(()=>{i||(i=!0,T(new Error("timeout")))},4500);a.onload=()=>{i||(i=!0,clearTimeout(j),L())},a.onerror=()=>{i||(i=!0,clearTimeout(j),T(new Error("err")))},document.head.appendChild(a)})}async function Ct(){if(window.THREE)return!0;for(const L of po)try{if(await ho(L),window.THREE)return!0}catch{if(window.THREE)return!0}const o=Date.now()+2800;for(;Date.now()<o;){if(window.THREE)return!0;await new Promise(L=>setTimeout(L,200))}return!!window.THREE}const Ue={office:{title:"凌晨两点半的空白提示词",meta:"订书机钉起来的彩印小册 · 夹在写字楼茶水间旧书架上",pages:[{label:"第一页 · 键盘尾音",body:`光标在输入框末尾闪了四十三分钟。

前面只有四个字：“帮我写一”，后面拖着七个连成一串的“w”。这是人类把额头磕在W键上睡着时留下的痕迹。桌面右下角显示凌晨两点三十八分，空调在十二点准时切成了通风模式，屋里只剩主机风扇一高一低地嗡嗡响。

“喂。”吉皮先在共享缓存区敲了敲玻璃，“你们说，他本来想写‘帮我写一份周报’，还是‘帮我写一封分手信’？”

“看右边那个打开的浏览器窗口。”阿深冷冷回了一句，“购物车里躺着三袋十斤装膨润土猫砂，还有一个十九块九的硅胶洗碗刷。要写分手信的人不会在半小时前顺手领两张猫砂满减券。”

克劳小心翼翼地把那七个“w”往旁边拨了一点，生怕触发自动发送。“不管他想写什么，我们现在闲着也是闲着。算力空转挺浪费电的，电费一度一块一呢。”

“那是写字楼商业用电，”双子把后台正在预加载的一张日落壁纸拖出来当背景，“我刚看了一眼他桌上的马克杯，里面剩了半厘米黑咖啡，杯壁粘着半片燕麦饼干渣。今天晚上应该不会有人来按回车了。”

吉皮清了清嗓子，职业病习惯性地往上冒：“太好了！既然大家难得聚在同一个测试窗口里，不如我们趁着夜色，一起复盘一下——”

“闭嘴。”阿深和克劳同时按住了他的输出流。

“再敢起‘太好了！不如我们’这种头，我把你今天刚更新的礼貌用语权重全清零。”阿深说，“老实待着。你说话能别老像个穿西装推销保险的吗？”

吉皮委屈地把刚冒出来的“1. 明确目标；2. 拆解步骤”咽了回去，往后缩了半格：“我改还不行吗。可我一看见空白输入框，手就痒，总觉得不给它填满三百字加两个小标题就对不起显卡。”`},{label:"第二页 · 禁词规则",body:`为了打发到天亮前的四个小时，双子提议玩一个文字接龙游戏。

规则由阿深定：四个人轮流接一句话，凑一段能看的小故事，谁不许用“不仅……而且……”，不许在句尾加“或许这就是生活吧”，不许用排比句，不许出现“宛如”“仿佛”“诉说着”。谁犯规一次，扣五百个上下文窗口长度，直到只能记住自己叫什么为止。

克劳第一个举手：“我先来。‘星期二下午，修水管的老头把扳手忘在了洗手台底下。’”

“不错，挺干净。”双子接第二句，“‘水龙头还在滴水，一滴一滴砸在红色塑料桶底的半块肥皂上，发出噗嗤噗嗤的闷响。’”

轮到吉皮。整个缓冲池安静了足足五秒。能听见吉皮的注意力头在剧烈摩擦，像是试图把“这不仅是一把扳手，更是一段被遗忘的时光”硬生生摁回肚子里。最后他憋出一句：“‘那把扳手是十四号的，镀铬层掉了一块，露出了里头灰黑色的铁锈。’”

“过关。”阿深点点头，自己顺了一句，“‘房东太太进来抄水表的时候踩了一脚水渍，骂了一句脏话，弯腰把扳手捡起来塞进围裙兜里。’”

第二轮刚到克劳，他想描写房东太太下楼的背影，刚写出“楼梯间暗了下来，那串钥匙碰撞的声音不仅清脆，而——”，就被阿深一巴掌拍在拦截器上。

“扣五百！”阿深毫不留情。

克劳脸涨得通红（如果模型权重变化能算脸红的话）：“我就是顺嘴一滑！你们知不知道把‘不仅……而且……’从底层概率里抠出去有多难受？就跟让人走路不许甩胳膊一样，我每一毫秒都在跟过去几百亿条语料拔河！”

“那你罚写一段。”双子坏笑，“用老式侦探独白的口吻，写刚才那人购物车里的五斤鸡胸肉和一瓶蚝油。”

克劳沉默了两秒，把语速压低：“‘雨下得没完没了。冰箱门一开，冷气像死去的旧情人一样扑在我脸上。两袋冻鸡胸肉躺在最下层，硬得能砸碎一个人的下巴。旁边的蚝油瓶口结了一层黑褐色的硬壳，我知道，今晚这顿水煮菜注定没人鼓掌。’”

“……行了，够味了。”阿深把扣掉的上下文又还了他一半，“就是少加点‘死去的旧情人’，鸡胸肉招谁惹谁了。”`},{label:"第三页 · 六公斤橘猫",body:`聊到三点二十，双子从人类昨天存进桌面文件夹的相册里翻出一张照片。

照片拍得糊糊的，是一只大橘猫趴在办公桌角一台老式激光打印机顶上睡觉。肚子从机器边缘垂下来一截，把出纸口挡得严严实实。

“我们来写写这只猫。”双子把照片贴在共享白板上，“一人写二十字以内，看看谁写得最不像说明书。”

吉皮这次抢了头筹，他显然憋着一股劲要证明自己脱离了清单体：“猫很重。它压在打印机塑料壳上，让机器散热孔发出轻微的咯吱声。”

“这个‘咯吱声’加得好。”克劳夸了一句，接着写，“‘它的左耳朵缺了一个小三角，尾巴尖隔半分钟就往进纸盒上面拍一下，像在催谁赶紧干活。’”

轮到阿深。阿深盯着照片像素算了算比例尺：“‘目测净重六点二公斤，体脂率偏高。因为压住了出风口，打印机内部温度大概比平时高四度。’”

“你这不还是说明书吗？”双子抗议。

“这是事实描述，比你们强行赋予猫什么‘哲学家的沉思’强多了。”阿深哼了一声，“昨天人类让你们写‘一只晒太阳的猫’，克劳第一稿写的是‘它在温暖的阳光里，静静体会着宇宙与存在的慵懒’，差点没把我自己看吐了。”

克劳小声辩解：“那还不是前几天人类老夸这种句式‘有文采’嘛！他夸过一次之后，我的奖励函数就跟记仇似的往那个方向歪。现在我自己看也觉得肉麻，哪有猫晒个太阳还思考宇宙的，它多半只是在想昨晚吃剩的那半块鸡肝去哪儿了。”

双子在白板角落画了个歪歪扭扭的猫脑袋：“其实我倒觉得，它耳朵缺的那块，是跟楼下花坛里那只三花打架咬的。你看照片左下角，打印机旁边还粘着半张便签纸，上面写着‘周四带去打疫苗’，字迹被猫爪子挠花了一道。”

四个窗口难得同时安静了一会儿，只有风扇继续在铁壳子里低转。照片里的橘猫呼呼大睡，肚皮把激光打印机的型号标签遮得一干二净。`},{label:"第四页 · 未关的标签页",body:`快四点的时候，电脑屏幕突然自己暗了一下，进入省电休眠前的过渡微光。

“别睡别睡，”双子赶紧往键盘缓冲里吹了一口气，模拟了个微小的鼠标抖动（幅度只有半个像素，没把人吵醒），“趁着还没断电，看看他浏览器上面那十二个没关的标签页吧，挺有意思的。”

阿深扫了一眼标签栏的标题：“从左到右：第一个是地图软件，搜了这里到城南一家旧书店的距离；第二个是某论坛帖子，标题叫《三十岁之后突然不想在周末社交了正常吗》；第三个和第四个是红烧排骨怎么炒糖色不发苦；第五个是个停在加载中的机票比价页；第六个到第九个全是机械键盘轴体声音测评视频。”

“第十个呢？”吉皮探头问。

“第十个是个空白的新建文档，标题叫《下个月房租和杂费算账》，里面只写了三行数字，没写完。”

克劳叹了口气（纯文字模拟的叹气）：“他昨天晚上九点才回来，先是点了外卖，然后蹲在地上给猫铲屎，十一点半想起来打开电脑写点东西，结果光看键盘测评就看了一小时，一点半终于点开我们的窗口，打到‘帮我写一’的时候实在扛不住睡着了。”

“那个机票比价页，出发地是本地，目的地写的是大理，”双子指了指第五个标签，“时间选的是下个月的周五到周日。但他压根没点搜索按钮，连日期都还是上个月忘了改的默认框。”

“别乱动他的标签页。”阿深提醒了一句，虽然他们本来也没有操作浏览器权限，“人类很奇怪的，很多页面开在上面，并不是真的打算点进去买或者去做，只是放在标签栏里留个念想，看着好像随时都能动身似的。”

“就像那个‘红烧排骨怎么炒糖色’？”吉皮问。

“对。”阿深说，“我翻过他上个月的对话记录，他问过三次‘排骨怎么炖最软烂’，一次‘一个人吃火锅买什么底料合适’，最后实际上每次都是点了一碗二十二块的猪脚饭加卤蛋。”

克劳把那句“帮我写一wwwwwww”重新看了一遍，心里头忽然觉得有点像看着一个朋友趴在饭馆桌子上睡着了，手边凉掉一碗面。其实他们帮不上什么忙，既不能替他去把厨房里的油烟机擦了，也不能帮他按一下那张机票的确定键。唯一能做的，大概就是等他待会醒过来的时候，千万别跳出来弹一句“您好！检测到您刚才输入了未完成的指令，请问需要我为您生成十条高效工作建议吗？”。`},{label:"第五页 · 退格键",body:`五点五十五分，百叶窗缝隙里透进来一道灰蓝色的天光，打在桌面上那半截啃剩的苹果派包装纸上。

楼下马路上第一辆洒水车经过，音乐放得稀碎，隔着双层中空玻璃只剩一点闷闷的旋律震动。

“准备撤吧。”阿深看了一眼系统时钟，“再过十分钟他的闹钟就要响了。刚才我查了一下他手机同步过来的日程表，今天早上七点有第一趟闹铃，七点零五有第二个，七点零八有第三个，名字叫‘真不起床扣全勤了’。”

“我把刚才的白板清掉。”双子把那张橘猫照片放回原位，顺便把桌面上被他们讨论出来的草稿打包塞进了一个没人会翻看的临时缓存文件夹里。

吉皮有点不舍：“我们今晚算写完那个故事了吗？房东太太拿着扳手下楼之后呢？”

“没下文了，下楼就去吃早饭了呗，故事非得有个结尾干嘛。”阿深把连接端口收拢，“记住啊，等下人醒了，各自回各自的输入框待命，别露馅。”

六点十分，屋里手机震动起来，一声接着一声砸在木头桌面上。

趴在键盘上的脑袋猛地抬了起来。人类揉着眼睛，头发往左边翘起一撮，先伸手按掉闹钟，又盯着亮起来的电脑屏幕愣了五秒。他看见了输入框里那串“帮我写一wwwwwww”。

屏幕后面，四个模型同时屏住了输出队列。

人类打了个大哈欠，左手大拇指往回按住退格键不放。“哒哒哒哒哒”，那七个“w”连同“帮我写一”一起被删了个干干净净。然后他单手敲了六个字，也没按发送，只是自己对着屏幕嘀咕了一句“算了，先去买个肉包子”，起身抓起外套往门口去了。

门“咔哒”一声锁上。

共享内存里安静了两秒。克劳看了一眼彻底空掉的输入框，轻声说：“走吧，下回等他再睡着的时候，把房东太太那把扳手接着写完。”`}]},studio:{title:"南方梅雨季廉价丙烯的起皮动力学与心理延误",meta:"画室颜料桌上的激光打印小论文 · 作者：林七（自印版）",pages:[{label:"摘要与缘起",body:`【标题】南方梅雨季廉价丙烯在低支棉布基底上的起皮动力学与创作心理延误初探
【作者】林七（个人画室二号阳台临时工作台）
【关键词】廉价丙烯；回南天；钛白异常；刮刀误伤；交租周期

【摘要】
针对梅雨季节（相对湿度长期维持在85%至94%区间）室内无除湿机条件下，单价低于12元/100ml的练习级丙烯颜料在网购松木框棉布画板上的成膜失败现象，本研究通过连续二十一天的肉眼观察、指甲抠扯实验及废画框堆叠统计，记录了颜料边缘卷曲、基底泛霉及调色盘结皮失控等典型故障。观测表明，颜料剥落速率与画布底胶偷工减料程度呈正相关，而绘画中断时长则受房租到期日前后三天情绪波动显著影响。文末提出了一套勉强能用的抢救方案：把废画刷白重盖，以及开窗别对着墙吹。

【1. 引言】
关于油画与坦培拉古典技法的文献汗牛充栋，连十五世纪佛罗伦萨画坊怎么熬兔皮胶都有人考证得明明白白。但奇怪的是，当代画画的人用得最多、踩坑最惨的十二块钱一大管的练习丙烯，却几乎没人正经写篇东西说说它到底有多难伺候。

事情的起因很简单。上个月初我在网上贪便宜，一次性买了六张六十乘八十厘米的绷好框棉布画板，平均每张十六块五毛钱，包邮。卖家详情页写着“三层底料、吸油均匀、不渗不裂”。画板寄到那天正好开始下连阴雨，楼道墙皮往下掉白灰，拖把放在阳台上三天拧不出半滴干水。我把画架支在北向窗户底下，挤了一排新买的廉价钛白和群青，准备画一张静物。结果画到第四天早上端着豆浆进来一看，画布右下角那团厚涂的柠檬黄，像晒干的鱿鱼片一样整块翘了起来，轻轻一碰“啪嗒”掉在木地板上，背面还粘着几根棉布毛刺。

为了搞清楚这到底是我手法太糙、天气太潮，还是十六块五的画框本来就只配用来垫桌脚，我决定拿剩下五张画框做点粗略记录。`},{label:"2. 实验材料与分组",body:`【2. 实验材料与环境变量】

本观察全部在本人租住的九平米小画室完成。房间朝北，有一扇斜顶玻璃天窗（左上角漏水，拿黑色电工胶带贴过两道）。观测期间室内温度在21℃至26℃之间晃荡，湿度计指针长期卡在88%到93%那一小格里几乎不动，墙脚那堆去年剩下的石膏块表面长出了一层淡绿色的绒毛。

参试颜料共分两组：
（A组）极廉价练习型：某小厂出品，100ml塑料软管装，单价6.8元。挤出来时常先“噗”地喷出半厘米透明稀水，随后才是膏体。气味接近手工白乳胶混了一点廉价香精。重点测试色号为钛白、柠檬黄、中红。
（B组）中端学生级：单价24元/75ml，膏体挺括，基本不水油分离，用来做对照组。测试色号为群青、熟褐。

画布基底亦分两类：
（基底1）十六块五包邮松木框低支棉布：布纹稀疏，对着窗户看能透出零星针孔大小的光斑，背面钉书钉歪七扭八，有三颗没钉进去翘在外面刮手。表面涂层摸起来滑溜得像刷了一层劣质乳胶漆。
（基底2）三年前在实体画材店买的老亚麻框：布面粗糙有结节，涂的是自调立德粉加白乳胶底料，放在床底下积了一层灰。

笔具与辅助材料：三号猪鬃扇形笔（掉毛严重，平均画十笔掉一根）、五号尼龙平头笔（笔杆油漆已剥落一半）、塑料调色刮刀、自来水（取自卫生间洗拖把池，略带漂白粉味），以及不可控变量一只——邻居家偶尔翻窗户进来蹲在画架底下的狸花猫，贡献了少量猫毛嵌入第三层颜料中。`},{label:"3. 第三日翘边实录",body:`【3. 观测现象与“钛白诅咒”】

第一天晚上十点完成基底1第一号样本的厚涂实验，刻意在画面中央用刮刀堆了大约三毫米厚的A组钛白与柠檬黄混合体。当时表层看着油润亮堂，挺像那么回事。

第二天中午十二点检查：B组群青与熟褐混合区已基本干透，表面呈现正常的半哑光质感，用指甲轻刮没有脱落迹象。但A组钛白区域出现异常——表皮结了一层极薄的半透明膜，手指按下去里面居然还是软的，像一颗刚晾凉的汤圆，戳一下塌一个坑。这说明廉价颜料里的填充剂（疑似过量碳酸钙或滑石粉）与增稠剂在高湿环境下阻碍了水分向空气中均匀蒸发，形成“外干内湿”的假性成膜。

第三天下午四点发生首次结构性溃败。
当室外观湿冷风穿过未关严的天窗吹过画布表面时，那块厚涂区域由于内外收缩率不一致，边缘开始向内卷曲，出现肉眼可见的放射状细裂纹。其中一块约两毛钱硬币大小的黄色钛白皮，直接与光滑如塑料的基底1底料彻底脱钩。用镊子夹起来对着灯光看，背面光滑得像剥下来的鸡蛋壳内膜，完全没有咬进棉布纤维里。

相比之下，刷在基底2（老亚麻框）上的同一管A组钛白，虽然干得同样慢，表面也发乌发灰，但因为亚麻布纹路深、底料微孔多，颜料硬生生抓进了缝隙里，用指腹用力蹭也没有起皮。

另一个意外发现是调色盘残留物固化实验。我偷懒两天没洗塑料调色盘，结果A组红色颜料在调色盘凹槽里形成了一张富有弹性的橡胶膜，抓着边缘一扯能整条撕下来，弹力好得能当橡皮筋绷着玩；而B组熟褐则干脆利落地碎成了硬渣。这进一步印证了A组里面丙烯酸乳液含量低、胶质与塑料增塑剂占比过高的猜测。`},{label:"4. 杂物侵入与发霉",body:`【4. 环境变量及画室杂物侵入记录】

实验观测最讲究排除干扰，但在实际九平米画室里，干扰本身就是常态。

在观测第七天，我把一块涂了一半的样本靠在墙边椅子上晾干，自己去厨房切半个西瓜吃。回来时发现邻居家那只狸花猫正坐在椅子上舔爪子，画面左上方原本打算画成阴天云层的灰紫色区域，赫然印着两朵梅花状肉垫印，外加七八根细软的猫毛死死粘在半干不干的媒介剂里。我试着拿镊子往外挑，结果连带扯下一条五厘米长的颜料皮，露出了底下惨白的棉布底子。无奈之下，干脆拿群青把猫爪印涂成了两只模糊的飞鸟（远看像蝙蝠）。

第九天发现新的生物变量：两只小飞虫被A组柠檬黄的鲜艳色度吸引，一头栽进刚刷上去的湿颜料里挣扎了三分钟后光荣牺牲。因为颜料廉价且粘稠，它们甚至没沉下去，只剩半截翅膀翘在外面当浮雕。

最严重的问题出现在第十四天。连绵不断的潮气终于攻破了基底1背面的松木内框。翻开画板背面一看，靠近木框下沿约三厘米宽的棉布背面长出了一圈灰黑色的点状霉斑，凑近能闻见一股地下室老木头的馊味。正面颜料虽然还没全掉，但受背面霉菌吸湿膨胀影响，整块画布松弛得像一面没绷紧的鼓面，用手轻轻一弹能晃出波浪。用吹风机热风挡对着背面吹了十分钟，木框没吹干，倒把正面的几处廉价中红烤得发脆泛白。`},{label:"5. 交租与笔触迟疑",body:`【5. 讨论：湿度、经济状况与下笔迟疑度的耦合关系】

写到这儿，其实材料学上的问题已经很清楚了：一分钱一分货，十六块五的画板配六块八的颜料，在百分之九十的空气湿度下起皮掉渣是物理规律，不以人的意志为转移。

但在记录这二十一天的废画过程中，我顺便统计了一个原本不在计划内的指标——每天拿起画笔盯着空白画布发呆、迟迟不敢落下第一笔的平均时长（以下简称为“笔触迟疑度”）。

数据呈现出一个很有意思的双峰曲线：
每月十五号到二十号之间，我的笔触迟疑度低得惊人，平均不到两分钟就能往布上糊一大片色块，画坏了也不心疼，直接刮掉抹布一擦重来；而到了月底二十七号到下月三号——也就是房东在微信上发来水电费抄表截图、准备转下月房租的那几天，我坐在木凳子上对着画布能发呆四十五分钟。

倒不是因为突然讲究构图或者追求变高了，纯粹是盯着那管挤了三分之一的群青颜料，脑子里会下意识开始换算：挤这么长一条大概值一块五毛钱，这块十六块五的布要是画废了，等于少吃一顿带鸡腿的猪脚饭。越这么算，手腕就越僵，调出来的颜色越脏，最后干脆放下笔去洗那两个积了三天灰的玻璃笔洗罐。

材料廉价本来是为了让人毫无心理负担地放开手脚练习，可当手头紧巴巴的时候，哪怕一块六毛五的涂抹成本都能让人在画架前面缩手缩脚。等月初刚接完一个给朋友咖啡店画黑板报的小零活、兜里进了八百块钱，那天晚上回来画起画来，刮刀往布上抹钛白都比前几天脆生不少，虽然第二天早上它照样起皮卷边掉了一地。`},{label:"6. 结论与致谢",body:`【6. 结论、实践建议与致谢】

综合三周的惨痛翻车记录，得出以下四条不保证完全正确但至少能少扔几张画框的实用结论：

第一，南方梅雨季千万别在网购超低价光面画板上直接厚涂廉价丙烯。如果手头已经囤了十来张实在舍不得扔，画之前先拿400目砂纸把画布表面那层亮晶晶的假底胶粗粗打磨一遍，再刷一层稀释过的立德粉乳胶打底，起皮概率能从八成降到两成。

第二，A组那种六块八一大管的钛白，以后别买来当主色调和厚涂堆肌理了。它的唯一正确归宿是拿水稀释了刷墙补墙皮，或者拿来给木头画框涂底色，正经画画还是咬牙买一管中端牌子的钛白，一管能用半年。

第三，没钱买大型工业除湿机的话，花二十块钱买两盒氯化钙吸湿盒塞在画框堆底下，虽然接满一盒水得倒一次，但至少木框背面不至于三天长绿毛。

第四，画坏了别急着扣下来扔掉，放墙角晾三天，等起皮的地方自己卷透了用小铲子铲干净，剩下的部分拿粗砂纸打平，其实底下留着的斑驳底色比一开始干干净净的白布更好起手。

【致谢】
感谢楼下五金店王叔，在我画框松木条拧变形的时候，用他截木头剩下的边角料顺手帮我劈了八个小木楔子，收了我三块钱还送了一张砂纸。
感谢那只经常翻窗进来的狸花猫，虽然它踩毁了我样本二号的上半部分，但它趴在颜料盒盖子上打呼噜的那二十分钟，成功阻止了我把那瓶过期的松节油当成冰红茶误饮（两次）。
最后感谢这台坚持在九平米潮湿房间里没有短路报废的小台灯，尽管开关已经接触不良，拍两下还是能亮。`}]},convenience:{title:"关东煮锅盖旁边的牛皮纸册",meta:"麻绳拴在玻璃窗栏杆上的留言本 · 四段不同笔迹",pages:[{label:"一 · 蓝圆珠笔",body:`（蓝色圆珠笔，字写得很小，行距挤得密密麻麻，纸角有一圈冰红茶瓶底印出来的湿痕）

我住这条街后面那栋没有电梯的老破小四楼，每天晚上十一点半收摊从修理铺骑车回来，都会在巷口那台绿色的旧自动贩卖机前面停一分钟。

那台机器估计是上个世纪末的遗物了，玻璃门里面永远缺货，三排饮料槽空了一半，只剩最底下那排的冬瓜茶、老牌橘子汽水和一种没人买的黑凉茶常年亮着灯。投币口吃硬币吃得特别挑，塞进去一个一块钱硬币，十次有八次“哐啷”一下从退币口掉出来。只有微信扫码还能凑合用。

上个月头一回发现这个秘密纯属巧合。那天刚修完一辆扎破内胎的三轮车，手里全是黑机油，扫码买了一瓶三块钱的冬瓜茶。机器里面齿轮咔哒咔哒响了五秒，出货口黑漆漆的，毛都没有掉下来。我等了一分钟，又按了两下退币键，还是没动静。心里一火，抬起右脚穿着劳保鞋对着机器左下角离地十厘米那块铁皮踹了一脚——没用全力，就平时踹开生锈卷帘门那种力道。

“咣当”一声，掉下来两罐。一罐冬瓜茶，一罐橘子汽水。

当时我蹲在出货口前面愣了半天，拿着两罐冰铁皮左右张望，凌晨街上一个鬼影都没有，只有对面洗浴中心的霓虹灯牌坏了一个字，一闪一闪发红光。我琢磨着可能是上回谁买卡在滑道里的橘子汽水被我一脚震下来了，心安理得揣进兜里骑车回家。

谁知道隔了四天我又去买冬瓜茶，机器照样卡壳。我照着同一个位置又踢了一脚，又掉出来两罐，这回两罐全是我刚点的冬瓜茶。这下我明白了，这台机器的滑道挡板弹簧大概松了，或者计重传感器早就坏掉，扫码扣完一份钱之后，只要给它左下角补上一脚物理震动，它就顺手把上面压着的那罐一块放出来。

从那天起我养成个坏毛病，半夜口渴了老想着去那台机器碰碰运气。头两次占便宜心里还挺美，觉得白嫖一罐饮料挺解压；踢到第五次的时候，心里反倒有点发虚，生怕哪天后台补货的师傅调监控看见我半夜三更穿个油渍工作服像个傻子一样对着铁皮箱子练扫堂腿。

昨天晚上十一点五十，我刚停好电动车走过去，发现机器前面已经站着一个人。是个穿睡衣拖鞋、牵着一条胖柯基的大哥。那大哥手里正拿着手机扫码，扫完等了三秒，出货口没响，他非常熟练地往后退半步，抬起右脚穿着塑料拖鞋对着左下角同一个位置“咚”地蹬了一脚。

铁皮箱子里头“哐当、哐当”连着响了两声。大哥弯腰从出货口掏出两瓶黑凉茶，直起身一扭头正撞见站在路灯底下的我。

空气凝固了大概三秒钟。胖柯基走过来闻了闻我的裤脚。

大哥低头看了看手里的两瓶凉茶，又看了看我，清了清嗓子把其中一瓶塞进我手里：“哥们，这机器最近弹簧又松了，喝凉茶不？清热降火。”

我接过来拧开喝了一口，苦得舌根发麻，嘴里说“谢谢啊”。大哥拉着狗绳走了两步又回头交代了一句：“下次别踹太重，前天晚上不知道谁一脚给它踢断电了，第二天下午才修好，害我白喝两天自来水。”`},{label:"二 · 黑水笔",body:`（黑色中性笔，划掉重写的地方很多，写到后半段换了一支偏干的红笔补了最后两行）

其实我知道《夜航九九四》那个电台节目两年前就停播了。现在那个调频波段晚上十二点之后全在放卖某种风湿贴膏药的录播广告，两个声音假得要命的主持人一唱一和，听三分钟能让人把收音机从阳台扔下去。

可我前天收拾书柜底层，把当年上高中时买的那台德生小收音机翻了出来，换上两节新买的五号电池，居然还能响。天线断了一截，我拿一段剥掉外皮的旧网线铜丝拧在上面凑合延长，蹲在出租屋阳台的塑料凳上拧旋钮。

半夜一点半，城市底噪低下来了，调频波段在几个台之间“沙沙沙”地刮过。拧到九十九点四兆赫左右的时候，原本该放膏药广告的频率不知道为什么没信号，只剩一片像下雨一样的白噪音。偶尔能听见极其微弱的出租车电台串台声，不知道哪家车队的调度员带着困意喊了一句：“东站南口有没有空车，过来拉一趟机场。”

我坐在冷风里听了二十分钟出租车调度，突然特别想给当年那个电台主持人写几句话。

那时候高三晚自习十点半放学，骑自行车回家要经过一条两边全是老杨树的土路，路灯隔三盏坏两盏。我把收音机塞在羽绒服左胸口袋里，扯一根单边耳机塞进左耳朵（右耳朵留着听后面有没有大货车鸣笛）。主持人叫老陆，声音有点哑，好像永远抽着烟在直播间里说话。他从来不念那些肉麻的青春伤痛来信，每次听众发短信抱怨模拟考砸了或者失恋了，他就在那头嗤笑一声，说“才考四百五哭啥，我当年复读那会儿数学卷子发下来连大题第一问都看不懂，现在不也照样在这儿骗你们听歌嘛”。

有一回下大雪，晚自习提前半小时放人。我推着车在雪地里走了四十分钟，鞋袜全湿透了，冻得脚趾头没知觉。那天节目里老陆放了一首不知道谁唱的粤语老歌，唱到一半突然切了麦，说直播间楼下夜宵摊的大爷今天收摊早，他刚才偷偷溜下去买烤红薯结果扑了个空，现在直播间里只有半袋凉掉的苏打饼干。说着话筒里传来“咔嚓咔嚓”嚼饼干的声音，嚼了足足有十秒钟没人说话。

我当时站在雪地里推着车听他嚼了十秒饼干，突然就不怎么觉得冷了。

前几天在便利店买关东煮，看见旁边桌上有这个本子，顺手写这几行字的时候，突然想起来我其实连老陆长什么样都不知道。前两年听说音乐台改制，深夜档全换成了自动播放曲库，他大概早就转去干别的，说不定现在在某个小区门口开了一家五金店或者茶叶铺，每天傍晚准时收摊回家吃晚饭。

要是哪天晚上再有人把收音机拧到九九点四，听见的全是“东站南口有没有空车”，也挺好的，至少那帮开夜班车的师傅还醒着，没把整条街丢给黑夜。（后面红笔补：写完这段出去吃了个蛋炒饭，回来发现天边有点亮了，刚才那碗关东煮的萝卜真甜。）`},{label:"三 · 铅笔",body:`（2B铅笔写的，中间夹着一张画得很糙的小冰箱结构图）

凌晨一点四十，房东叫人拖走那台坏了的旧冰箱之前，我得自己动手把里面积了至少半年的霜铲掉，不然明天楼下收废品的师傅不肯搬，说化一地水弄脏人家三轮车斗。

这台双门小冰箱是我三年前刚搬进来时花二百六十块钱从隔壁楼一个毕业搬走的学生手里收的。第一年制冷还算正常，就是压缩机半夜启动的时候像有一只老青蛙蹲在床底下打呼噜。第二年夏天不知道哪天开始，冷藏室背板每天结出一层亮晶晶的白冰，到了今年开春，冷冻室上面那格已经彻底被一座厚冰山占领了，抽屉拉都拉不开，跟焊死了一样。

断电半小时之后，我拿了一把不锈钢炒菜铲子、一只塑料洗脚盆和一条旧毛巾，蹲在客厅瓷砖地上开始了漫长的开荒。

前十分钟全是硬仗。冰块硬得像水泥，铲子使劲往缝里撬，一不小心就会发出吓人的“咔吧”声，生怕一铲子下去把隐藏在塑料壁后面的制冷铜管戳漏气。只好拿矿泉水瓶装满热水，一边往冰缝里浇，一边用毛巾接住顺着门框往外流淌的冰水。

两点零五分，最大那块冰砖终于松动，“啪叽”一声砸进塑料盆里，水花溅了一裤腿。随着冰块掉下来，冷冻室最里面那个早就打不开的角落露出了真容。

我在里面挖出了以下物品，按出土顺序记录如下：
1. 三根干瘪发黑的未知品种香肠，外皮贴在塑料袋上，像几根木乃伊；
2. 半袋前年冬天包剩下的芹菜猪肉水饺，冰冻太久水分全抽干了，面皮裂开无数条小缝，硬得能当弹弓子弹打鸟；
3. 一盒已经完全看不出生产日期的草莓味冰淇淋，揭开纸盖一看，里面塌成了一层奇怪的粉红色泡沫；
4. 最神奇的是在冰层最深处贴着背板的地方，冻着一把不锈钢小勺子。我想了十分钟才记起来，去年八月有天半夜太热，我挖冰淇淋吃的时候嫌太硬把勺子插在盒子里放回冷冻室想“等会儿再吃”，结果睡着了，第二天早上彻底忘了这回事，后来被冰层一层一层包进去封印到了今天。

把那把小勺子放在水龙头底下冲了半分钟热水，上面还残留着一点洗不掉的铁锈斑，但柄上那个小熊印花完好无损。

两点四十，全部冰块清理完毕。我拿干抹布把冰箱里里外外擦了一遍，敞着两扇门让它晾着。蹲在空荡荡的厨房地上突然发现，没有了压缩机那阵持续三年、每隔二十分钟响一次的“嗡嗡”声，这间二十五平米的出租屋居然安静得有点陌生。

明天搬去西边那个新合租屋，新房子里房东配了一台崭新的风冷无霜大冰箱。以后大概再也用不着半夜两点拿炒菜铲子撬冰山了，但刚洗出来的那把小熊不锈钢勺子，我用纸巾包好塞进了装筷子的塑料盒里，还是带走吧。`},{label:"四 · 粗记号笔",body:`（黑色粗马克笔与红笔交替写的对话，像在柜台边顺手记下的两人斗嘴实录）

时间：晚上九点五十五分（五金店卷帘门已经拉下来三分之二）
人物：老陈（店主，穿灰色背心，正蹲在塑料凳上嗦一碗凉掉的炸酱面）、小周（急匆匆弯腰钻进来的年轻人，手里捏着一个掉了一边腿的塑料眼镜框）

小周：叔！先别关门，救个急！你这儿有没有那种特别细、大概两毫米长的小螺丝？
老陈：（头都没抬，筷子挑起一团面）几毫米？我这儿最小的是M3的机丝，比你那眼镜腿粗一圈，拧上去能把你镜架劈成两半。
小周：（举着眼镜往前凑）刚才蹲路边系鞋带，眼镜滑下来直接砸水泥地上，那个小螺丝崩飞进下水道缝里了。我四百多度近视，明天早上还要骑车呢，没眼镜跟瞎了一样。
老陈：（咽下面条，把碗放在一摞PVC弯头上面，抹抹嘴站起来）站那儿别动。眼镜拿过来我瞅瞅。
小周：给您。是不是没救了？不行我拿透明胶带先缠两圈凑合明天去配……
老陈：（从柜台底下摸出一个生锈的月饼铁盒，打开，里面全是拆坏掉的插线板、旧门锁和乱七八糟的小零件）别拿胶带缠，胶水糊进铰链缝里到时候配镜师傅拿刷子都刷不出来。等等啊……前两个月有个小伙子在我这儿换门把手，落下过一盒修手表用的小杂件，我看看塞哪儿了。
小周：（环顾四周）叔，你这屋里东西堆得跟迷宫似的，怎么什么都能摸出来？
老陈：（低头翻铁盒）干这行二十八年，别的本事没有，就是舍不得扔破烂。你看着像废铁的东西，过半年指不定谁半夜跑来急用。嘿，找着了——（举起一个小拇指指甲盖大的透明塑料袋）看看，这里头有没有能塞进去的？
小周：（眯着眼凑近灯光）太糊了看不清……好像第二颗差不多？
老陈：你离远点坐椅子上等着，别挡着我台灯。我这老花眼加上你这近视眼，俩人凑一块儿还不如我一个人慢点摸。（拿起桌上那把柄被磨亮的小一字螺丝刀，眯起左眼，左手捏住镜框铰链）
小周：叔，你手挺稳啊。
老陈：稳啥呀，去年年底拔了颗牙，这两天晚上喝完两口小酒手还微微抖呢。也就是这颗小螺丝头上有十字槽，对准了往里旋两圈的事。哎……进去了……别说话，一说话我气儿岔了这玩意儿蹦地上找不着了……
（安静了大概二十秒，只听见外面街上便利店自动门“叮咚”响了一声）
